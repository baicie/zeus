# This file is mounted into the running container by
# `deploy/docker-compose.deploy.yml`, and `.github/workflows/playground-image.yml`
# uploads it to the host on every deploy. Keep it as the single source of truth:
# an image with a stale copy here would silently weaken the CSP.
#
# R4.3: same dist served on the public host origin (80) and the sandbox origin
# (81). The sandbox response-header CSP is mandatory; keep frame-ancestors
# pinned to the public Playground origin.
server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
  # The inline theme/language bootstrap runs before first paint; a hash keeps it
  # working without opening script-src to 'unsafe-inline'.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' sha256-KuyZfqRoIAl3lhRCxo4t/k9XLIDez6DvQV5LyvNnL8w=; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src https://panel.moonbyte.top:8443; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 81;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
  add_header Content-Security-Policy "sandbox allow-scripts; frame-ancestors https://playground.moonbyte.top:8443" always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Cross-Origin-Resource-Policy cross-origin always;

  location / {
    try_files $uri $uri/ =404;
  }
}
