# The host and the sandbox are the same files on two origins. Module workers
# and the opaque-origin iframe request assets with Origin: null, so every asset
# is CORS-readable; the sandbox document carries its own restrictive CSP.
server {
  listen 80;
  listen 81;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cross-Origin-Resource-Policy cross-origin always;
  add_header Access-Control-Allow-Origin * always;
  # The inline theme/language bootstrap in index.html and webc.html runs before
  # first paint. A hash keeps it working without opening script-src to
  # 'unsafe-inline'. `pnpm check:playground-theme-i18n` recomputes the hash from
  # the built HTML and fails when this value drifts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' sha256-KuyZfqRoIAl3lhRCxo4t/k9XLIDez6DvQV5LyvNnL8w=; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src https://panel.moonbyte.top:8443; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  location = /sandbox.html {
    # Response-header CSP is mandatory: a meta tag cannot express
    # frame-ancestors or force an opaque origin on direct/third-party embeds.
    # Ingress deployments must also add the approved host, for example:
    #   frame-ancestors https://playground.example.com:8443
    add_header Content-Security-Policy 'sandbox allow-scripts' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Access-Control-Allow-Origin * always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
