# The host and the sandbox are the same files on two origins. Module workers
# and the opaque-origin iframe request assets with Origin: null, so every asset
# is CORS-readable; the sandbox document carries its own restrictive CSP.
server {
  listen 80;
  listen 81;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cross-Origin-Resource-Policy cross-origin always;
  add_header Access-Control-Allow-Origin * always;

  location = /sandbox.html {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Access-Control-Allow-Origin * always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
