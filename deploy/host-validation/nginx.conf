# TLS ingress template. Replace example.com and certificate paths at deploy
# time. The sandbox must be a separate origin; never proxy it through the host
# server_name.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name studio.example.com sandbox.studio.example.com admin.example.com ai.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name studio.example.com;

  ssl_certificate     /etc/tls/studio.crt;
  ssl_certificate_key /etc/tls/studio.key;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src https://sandbox.studio.example.com; object-src 'none'; base-uri 'none'" always;

  client_max_body_size 1m;
  location / {
    proxy_pass http://playground:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 443 ssl http2;
  server_name sandbox.studio.example.com;

  ssl_certificate     /etc/tls/sandbox.crt;
  ssl_certificate_key /etc/tls/sandbox.key;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Cross-Origin-Resource-Policy cross-origin always;

  location / {
    proxy_pass http://playground:81;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 443 ssl http2;
  server_name admin.example.com;

  ssl_certificate     /etc/tls/admin.crt;
  ssl_certificate_key /etc/tls/admin.key;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'" always;

  location / {
    proxy_pass http://admin:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 443 ssl http2;
  server_name ai.example.com;

  ssl_certificate     /etc/tls/ai.crt;
  ssl_certificate_key /etc/tls/ai.key;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'" always;

  # nginx inside the workbench image proxies /ai-host/ to ai-host:8788.
  location / {
    proxy_pass http://ai-workbench:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
