<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f8" />
    <title>Zeus Compiler Playground</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #20292c;
        background: #f5f7f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 22px;
        border-bottom: 1px solid #d9e0e2;
        background: #fff;
      }
      header strong {
        font-size: 15px;
      }
      header a {
        color: #176b58;
        text-decoration: none;
      }
      main {
        max-width: 1440px;
        margin: 0 auto;
        padding: 24px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      .toolbar p {
        margin: 5px 0 0;
        color: #59666a;
        font-size: 13px;
      }
      button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid #c7d2d4;
        border-radius: 5px;
        color: #263236;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #eef5f3;
      }
      button:focus-visible {
        outline: 3px solid #79b6a5;
        outline-offset: 2px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .actions a {
        color: #176b58;
      }
      #status {
        min-height: 24px;
        color: #46585d;
        font-size: 13px;
      }
      #manual-copy {
        margin-bottom: 16px;
      }
      #manual-copy label {
        display: block;
        margin-bottom: 6px;
      }
      #copy-text {
        width: 100%;
        min-height: 120px;
        padding: 10px;
        font:
          13px/1.5 ui-monospace,
          monospace;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(280px, 0.82fr) minmax(0, 1.35fr);
        min-height: 560px;
        border: 1px solid #d9e0e2;
        border-radius: 6px;
        overflow: hidden;
        background: #fff;
      }
      .source-pane {
        border-right: 1px solid #d9e0e2;
      }
      .pane-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        padding: 0 14px;
        border-bottom: 1px solid #d9e0e2;
        font-size: 13px;
        font-weight: 650;
      }
      .file-name {
        color: #687579;
        font-weight: 450;
      }
      .tabs {
        display: flex;
        gap: 4px;
        padding: 8px 10px 0;
        border-bottom: 1px solid #d9e0e2;
        overflow-x: auto;
      }
      .tabs button {
        flex: 0 0 auto;
        min-height: 34px;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        color: #59666a;
        background: transparent;
        font-size: 13px;
      }
      .tabs button[aria-selected='true'] {
        border-bottom-color: #17755f;
        color: #145b4c;
        font-weight: 650;
      }
      pre {
        min-height: 500px;
        margin: 0;
        padding: 18px;
        overflow: auto;
        color: #e8eeef;
        background: #20292c;
        font:
          12px/1.65 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        tab-size: 2;
        white-space: pre;
      }
      .source-pane pre {
        min-height: 516px;
      }
      .meta {
        padding: 14px 16px;
        border-top: 1px solid #d9e0e2;
      }
      .meta p {
        margin: 0;
        color: #59666a;
        font-size: 12px;
        line-height: 1.6;
      }
      #size-view {
        min-height: 500px;
        padding: 20px;
        background: #fff;
      }
      .sizes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .sizes h2 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        padding: 7px 4px;
        border-bottom: 1px solid #e2e8e9;
        text-align: left;
      }
      th {
        color: #59666a;
        font-weight: 500;
      }
      td:last-child {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .error {
        color: #ffd8d4;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 760px) {
        main {
          padding: 16px;
        }
        .toolbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .workspace {
          grid-template-columns: 1fr;
        }
        .source-pane {
          border-right: 0;
          border-bottom: 1px solid #d9e0e2;
        }
        .source-pane pre,
        pre {
          min-height: 280px;
        }
        .sizes {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Zeus Compiler Playground</strong>
      <a href="../guide/getting-started">文档</a>
    </header>
    <main>
      <div class="toolbar">
        <div>
          <h1>Counter 编译样例</h1>
          <p>
            静态示例由当前 Rust 编译器生成，可查看 DOM、SSR、内部 IR 与诊断。
          </p>
        </div>
        <div class="actions">
          <button id="copy-source" type="button" title="复制 TSX 源码" disabled>
            复制源码
          </button>
          <button id="copy-share" type="button" disabled>复制分享链接</button>
          <a id="share-link" href="?view=dom">打开当前视图链接</a>
          <button id="retry-load" type="button" hidden>重新加载样例</button>
        </div>
      </div>
      <p id="status" role="status" aria-live="polite">正在加载编译样例…</p>
      <div id="manual-copy" hidden>
        <label for="copy-text">手动复制文本（已选中）</label>
        <textarea id="copy-text" readonly></textarea>
      </div>
      <section class="workspace" aria-label="编译结果浏览器">
        <div class="source-pane">
          <div class="pane-heading">
            <span>输入</span><span class="file-name">counter.tsx</span>
          </div>
          <pre><code id="source">读取样例中…</code></pre>
        </div>
        <div class="output-pane">
          <div class="pane-heading">
            <span>编译结果</span
            ><span class="file-name">Rust Native Compiler</span>
          </div>
          <div class="tabs" role="tablist" aria-label="编译结果类型">
            <button
              id="tab-dom"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="panel"
              disabled
              data-view="dom"
            >
              DOM JS
            </button>
            <button
              id="tab-ssr"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="panel"
              disabled
              data-view="ssr"
            >
              SSR JS
            </button>
            <button
              id="tab-ir"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="panel"
              disabled
              data-view="ir"
            >
              IR
            </button>
            <button
              id="tab-diagnostics"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="panel"
              disabled
              data-view="diagnostics"
            >
              诊断
            </button>
            <button
              id="tab-size"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="panel"
              disabled
              data-view="size"
            >
              输出尺寸
            </button>
          </div>
          <div
            id="panel"
            role="tabpanel"
            aria-labelledby="tab-dom"
            aria-busy="true"
            tabindex="0"
          >
            <pre id="output"><code>加载中…</code></pre>
            <div id="size-view" hidden></div>
          </div>
          <div class="meta"><p id="notice"></p></div>
        </div>
      </section>
    </main>
    <script>
      const sourceNode = document.querySelector('#source')
      const output = document.querySelector('#output')
      const outputNode = document.querySelector('#output code')
      const sizeView = document.querySelector('#size-view')
      const panel = document.querySelector('#panel')
      const notice = document.querySelector('#notice')
      const status = document.querySelector('#status')
      const copySource = document.querySelector('#copy-source')
      const copyShare = document.querySelector('#copy-share')
      const shareLink = document.querySelector('#share-link')
      const retryLoad = document.querySelector('#retry-load')
      const manualCopy = document.querySelector('#manual-copy')
      const copyText = document.querySelector('#copy-text')
      const tabs = [...document.querySelectorAll('[role="tab"]')]
      const viewNames = {
        dom: 'DOM JS',
        ssr: 'SSR JS',
        ir: 'IR',
        diagnostics: '诊断',
        size: '输出尺寸',
      }
      const readView = () => {
        const requested =
          new URL(location.href).searchParams.get('view') || 'dom'
        return Object.hasOwn(viewNames, requested) ? requested : 'dom'
      }
      let sample
      let currentView = readView()

      const formatBytes = value => `${value.toLocaleString('en-US')} B`
      const renderSize = () => {
        sizeView.replaceChildren()
        const sizes = document.createElement('div')
        sizes.className = 'sizes'
        for (const [title, size] of [
          ['DOM bundle（含 runtime）', sample.bundleSize.dom],
          ['SSR bundle（含 runtime）', sample.bundleSize.ssr],
          ['DOM 生成模块（不含依赖）', sample.outputSize.dom],
          ['SSR 生成模块（不含依赖）', sample.outputSize.ssr],
        ]) {
          const section = document.createElement('section')
          const heading = document.createElement('h2')
          heading.textContent = title
          const table = document.createElement('table')
          const body = document.createElement('tbody')
          for (const [label, key] of [
            ['原始', 'raw'],
            ['gzip', 'gzip'],
            ['Brotli', 'brotli'],
          ]) {
            const row = document.createElement('tr')
            const name = document.createElement('th')
            name.scope = 'row'
            name.textContent = label
            const value = document.createElement('td')
            value.textContent = formatBytes(size[key])
            row.append(name, value)
            body.append(row)
          }
          table.append(body)
          section.append(heading, table)
          sizes.append(section)
        }
        const scope = document.createElement('p')
        scope.textContent = sample.bundleSize.label
        const tools = document.createElement('p')
        tools.textContent = `${sample.bundleSize.tool} · ESM · ES2022 · production · tree-shaking · minify；${sample.bundleSize.compression}`
        const platforms = document.createElement('p')
        platforms.textContent = `DOM 平台：${sample.bundleSize.dom.platform}；SSR 平台：${sample.bundleSize.ssr.platform}；SSR 宿主内置：${sample.bundleSize.ssr.externalBuiltins.join(', ') || '无'}`
        sizeView.append(sizes, scope, tools, platforms)
      }
      const renderView = (view, announce = true) => {
        if (!sample || !Object.hasOwn(viewNames, view)) return
        currentView = view
        tabs.forEach(tab => {
          const selected = tab.dataset.view === view
          tab.setAttribute('aria-selected', String(selected))
          tab.tabIndex = selected ? 0 : -1
        })
        const url = new URL(location.href)
        url.searchParams.set('view', view)
        history.replaceState(null, '', url)
        shareLink.href = url.href
        panel.setAttribute('aria-labelledby', `tab-${view}`)
        outputNode.classList.toggle('error', view === 'diagnostics')
        notice.textContent = ''
        output.hidden = view === 'size'
        sizeView.hidden = view !== 'size'
        if (view === 'dom' || view === 'ssr') {
          outputNode.textContent = sample[view]
          notice.textContent = sample.outputSize.label
        } else if (view === 'ir') {
          outputNode.textContent = JSON.stringify(sample.ir, null, 2)
          notice.textContent = sample.irNotice
        } else if (view === 'diagnostics') {
          outputNode.textContent = JSON.stringify(sample.diagnostics, null, 2)
          notice.textContent = '诊断来自独立的故意错误 TSX fixture。'
        } else {
          renderSize()
          notice.textContent =
            '生成模块和含 runtime 的生产 bundle 分别测量，完整依赖列表见 counter.json。'
        }
        if (announce)
          status.textContent = `已显示 ${viewNames[view]}；分享链接可恢复此视图。`
      }

      const loadSample = async () => {
        sample = undefined
        panel.setAttribute('aria-busy', 'true')
        retryLoad.hidden = true
        tabs.forEach(tab => (tab.disabled = true))
        copySource.disabled = copyShare.disabled = true
        status.textContent = '正在加载编译样例…'
        try {
          const response = await fetch('./counter.json')
          if (!response.ok) throw new Error(`HTTP ${response.status}`)
          const data = await response.json()
          if (
            data.schemaVersion !== 2 ||
            typeof data.source !== 'string' ||
            typeof data.dom !== 'string' ||
            typeof data.ssr !== 'string' ||
            !data.bundleSize ||
            !data.outputSize ||
            !data.ir ||
            !Array.isArray(data.diagnostics)
          ) {
            throw new Error('样例数据格式无效')
          }
          for (const size of [
            data.bundleSize.dom,
            data.bundleSize.ssr,
            data.outputSize.dom,
            data.outputSize.ssr,
          ]) {
            if (
              !size ||
              !['raw', 'gzip', 'brotli'].every(
                key => Number.isSafeInteger(size[key]) && size[key] >= 0,
              )
            )
              throw new Error('样例尺寸数据无效')
          }
          if (!Array.isArray(data.bundleSize.ssr.externalBuiltins))
            throw new Error('样例平台数据无效')
          sample = data
          sourceNode.textContent = sample.source
          tabs.forEach(tab => (tab.disabled = false))
          copySource.disabled = copyShare.disabled = false
          const requested = new URL(location.href).searchParams.get('view')
          renderView(currentView, false)
          status.textContent =
            requested && !Object.hasOwn(viewNames, requested)
              ? '未知视图，已显示 DOM JS。可用方向键、Home 和 End 切换视图。'
              : `样例已加载，当前显示 ${viewNames[currentView]}。可用方向键、Home 和 End 切换视图。`
        } catch (error) {
          sourceNode.textContent = '样例加载失败，请重新加载。'
          output.hidden = false
          sizeView.hidden = true
          outputNode.classList.add('error')
          outputNode.textContent = String(error)
          status.textContent = '样例加载失败。请检查网络后点击“重新加载样例”。'
          retryLoad.hidden = false
        } finally {
          panel.setAttribute('aria-busy', 'false')
        }
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => renderView(tab.dataset.view))
        tab.addEventListener('keydown', event => {
          if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key))
            return
          event.preventDefault()
          const next =
            event.key === 'Home'
              ? 0
              : event.key === 'End'
                ? tabs.length - 1
                : (index + (event.key === 'ArrowRight' ? 1 : tabs.length - 1)) %
                  tabs.length
          tabs[next].focus()
          renderView(tabs[next].dataset.view)
        })
      })
      const copy = async (value, success) => {
        let timeout
        try {
          if (!navigator.clipboard?.writeText)
            throw new Error('Clipboard unavailable')
          await Promise.race([
            navigator.clipboard.writeText(value),
            new Promise((_, reject) => {
              timeout = setTimeout(
                () => reject(new Error('Clipboard timeout')),
                2000,
              )
            }),
          ])
          manualCopy.hidden = true
          status.textContent = success
        } catch {
          manualCopy.hidden = false
          copyText.value = value
          copyText.focus()
          copyText.select()
          status.textContent =
            '浏览器未完成自动复制。文本已在下方选中，请按 Ctrl/Cmd+C 手动复制。'
        } finally {
          clearTimeout(timeout)
        }
      }
      copySource.addEventListener('click', () => {
        if (sample) void copy(sample.source, 'TSX 源码已复制。')
      })
      copyShare.addEventListener('click', () => {
        if (sample)
          void copy(shareLink.href, '分享链接已复制，可恢复当前视图。')
      })
      retryLoad.addEventListener('click', () => void loadSample())
      window.addEventListener('popstate', () => renderView(readView()))
      void loadSample()
    </script>
  </body>
</html>
