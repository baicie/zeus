# Stage 2 controlled deployment entry. It only runs on an approved host runner
# with the selected GitHub Environment, and refuses to run unless the
# environment variable ZEUS_HOST_DEPLOY_ENABLED is explicitly set to "true".
# This workflow is not executed by R3; it is the gate for a later authorized
# deployment.
name: Host Deployment Stage 2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Approved deployment environment
        type: choice
        options: [staging, production]
        default: staging
      manifest:
        description: Absolute path to the approved online deployment manifest
        required: true
      provenance:
        description: Absolute path to the CI provenance record
        required: true
      tenant:
        description: Isolated acceptance tenant id
        required: true

permissions:
  contents: read

concurrency:
  group: host-deployment-stage2-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.ZEUS_HOST_DEPLOY_ENABLED == 'true'
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, zeus-host]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify approved env file and images
        run: |
          test -f /etc/zeus/host-validation.env
          docker compose --env-file /etc/zeus/host-validation.env \
            -f deploy/host-validation/compose.yml config --quiet
      - name: Deploy immutable digests
        run: |
          docker compose --env-file /etc/zeus/host-validation.env \
            -f deploy/host-validation/compose.yml pull
          docker compose --env-file /etc/zeus/host-validation.env \
            -f deploy/host-validation/compose.yml up -d --wait --wait-timeout 180
      - name: Online acceptance
        env:
          ZEUS_ACCEPTANCE_ADMIN_EMAIL: ${{ secrets.ZEUS_ACCEPTANCE_ADMIN_EMAIL }}
          ZEUS_ACCEPTANCE_ADMIN_PASSWORD: ${{ secrets.ZEUS_ACCEPTANCE_ADMIN_PASSWORD }}
          ZEUS_ACCEPTANCE_AI_REPLAY: 'true'
          ZEUS_ACCEPTANCE_TENANT: ${{ inputs.tenant }}
        run: |
          pnpm check:deployment-acceptance \
            --manifest "${{ inputs.manifest }}" \
            --provenance "${{ inputs.provenance }}" \
            --write-mode isolated \
            --tenant "${{ inputs.tenant }}"
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-deployment-stage2-${{ inputs.environment }}
          path: temp/release/deployment-acceptance.json
          if-no-files-found: warn
