# Stage 2 controlled deployment entry. Inputs are passed only through env
# variables to a validated TypeScript CLI; no workflow expression is
# interpolated into shell command text. It requires an approved GitHub
# Environment, the deployment gate variable, a self-hosted zeus-host runner,
# a verified artifact bundle and an ancestor-of-main source commit.
#
# Modes:
# - simulate: validate artifacts, digests, provenance and the approved layout
#   without loading images or touching Docker services.
# - local-integration: start an isolated Compose project on non-production
#   ports, run the browser acceptance and remove it afterwards.
# - production: replace the four production containers transactionally, keep
#   them running on success, and roll back the previous containers and the
#   verified database backup on failure.
name: Host Deployment Stage 2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Approved deployment environment (must have protection rules)
        type: choice
        options: [staging, production]
        default: staging
      mode:
        description: Simulation, isolated local integration, or production transaction
        type: choice
        options: [simulate, local-integration, production]
        default: simulate
      prepare-run-id:
        description: Host Deployment Prepare run id containing the verified artifact bundle
        required: true
      tenant:
        description: Isolated acceptance tenant (lowercase, 3-32 chars)
        required: true
      expected-core-sha:
        description: Approved Core commit (must be an ancestor of main)
        required: true
      expected-ui-sha:
        description: Approved UI commit
        required: true
      manifest-name:
        description: Manifest file name inside the artifact bundle
        default: deployment.local.json
      provenance-name:
        description: Provenance file name inside the artifact bundle
        default: provenance.json
      manifest-sha256:
        description: SHA256 of the manifest file (sha256:<64 hex>)
        required: true
      provenance-sha256:
        description: SHA256 of the provenance file
        required: true
      candidate-sha256:
        description: SHA256 of deployment-candidate.json
        required: true
      prepare-artifact-sha256:
        description: GitHub Artifact digest of the prepare bundle (sha256:<64 hex>)
        required: true
      layout-name:
        description: Approved deployment layout inside the repository deploy/ directory
        default: deploy/host-validation/production.layout.json
      layout-sha256:
        description: SHA256 of the approved layout file (required for production)
        default: ''
      production-env-file:
        description: Host path to the 0600 production secrets env file
        default: /home/ubuntu/zeus-admin/.env
      state-dir:
        description: Host deployment state directory (locks, backups, reports)
        default: /var/lib/zeus-deploy
      project-name:
        description: Compose project name used for the four deployment containers
        default: zeus-host-validation
      failure-injection:
        description: Deterministic fault injection for rollback drills
        type: choice
        options:
          [
            none,
            before-up,
            after-backup,
            after-up,
            after-health,
            after-acceptance,
          ]
        default: none
      browsers:
        description: Acceptance browser engines (empty means three online, one local)
        default: ''
      keep-local:
        description: Keep the isolated local integration containers after success
        type: boolean
        default: false
      local-ports:
        description: Four loopback ports for local integration
        default: 8080,8081,8082,8083

permissions:
  contents: read
  actions: read

concurrency:
  group: host-deployment-stage2-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.mode != 'local-integration'
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, zeus-host]
    timeout-minutes: 90
    steps:
      - name: Verify deployment gate
        env:
          ZEUS_HOST_DEPLOY_ENABLED: ${{ vars.ZEUS_HOST_DEPLOY_ENABLED }}
        run: |
          test "$ZEUS_HOST_DEPLOY_ENABLED" = "true"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected-core-sha }}
          fetch-depth: 0
      - name: Verify approved source ancestry
        env:
          EXPECTED_CORE: ${{ inputs.expected-core-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_CORE"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          name: host-deployment-stage1
          run-id: ${{ inputs.prepare-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/zeus-deploy
      - name: Fetch trusted prepare run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.prepare-run-id }}
          ARTIFACT_DIR: ${{ runner.temp }}/zeus-deploy
        run: |
          gh api "repos/baicie/zeus/actions/runs/$RUN_ID" > "$ARTIFACT_DIR/prepare-run.json"
          gh api "repos/baicie/zeus/actions/runs/$RUN_ID/artifacts" > "$ARTIFACT_DIR/prepare-artifacts.json"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install script dependencies without lifecycle scripts
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Run the Stage 2 transaction
        env:
          ZEUS_HOST_DEPLOY_ENABLED: ${{ vars.ZEUS_HOST_DEPLOY_ENABLED }}
          ZEUS_DEPLOY_INGRESS_VERIFIED: ${{ vars.ZEUS_DEPLOY_INGRESS_VERIFIED }}
          ZEUS_DEPLOY_MODE: ${{ inputs.mode }}
          ZEUS_DEPLOY_ARTIFACT_DIR: ${{ runner.temp }}/zeus-deploy
          ZEUS_DEPLOY_MANIFEST: ${{ inputs.manifest-name }}
          ZEUS_DEPLOY_PROVENANCE: ${{ inputs.provenance-name }}
          ZEUS_DEPLOY_CANDIDATE: deployment-candidate.json
          ZEUS_DEPLOY_TENANT: ${{ inputs.tenant }}
          ZEUS_DEPLOY_EXPECTED_CORE: ${{ inputs.expected-core-sha }}
          ZEUS_DEPLOY_EXPECTED_UI: ${{ inputs.expected-ui-sha }}
          ZEUS_DEPLOY_MANIFEST_SHA256: ${{ inputs.manifest-sha256 }}
          ZEUS_DEPLOY_PROVENANCE_SHA256: ${{ inputs.provenance-sha256 }}
          ZEUS_DEPLOY_CANDIDATE_SHA256: ${{ inputs.candidate-sha256 }}
          ZEUS_DEPLOY_PREPARE_RUN_JSON: prepare-run.json
          ZEUS_DEPLOY_PREPARE_ARTIFACTS_JSON: prepare-artifacts.json
          ZEUS_DEPLOY_PREPARE_ARTIFACT_SHA256: ${{ inputs.prepare-artifact-sha256 }}
          ZEUS_DEPLOY_PAIR: pair.json
          ZEUS_DEPLOY_COMPOSE_FILE: ${{ github.workspace }}/deploy/host-validation/compose.yml
          ZEUS_DEPLOY_LAYOUT: ${{ github.workspace }}/${{ inputs.layout-name }}
          ZEUS_DEPLOY_LAYOUT_SHA256: ${{ inputs.layout-sha256 }}
          ZEUS_DEPLOY_PRODUCTION_ENV_FILE: ${{ inputs.production-env-file }}
          ZEUS_DEPLOY_STATE_DIR: ${{ inputs.state-dir }}
          ZEUS_DEPLOY_PROJECT: ${{ inputs.project-name }}
          ZEUS_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          ZEUS_DEPLOY_FAILURE_INJECTION: ${{ inputs.failure-injection }}
          ZEUS_DEPLOY_BROWSERS: ${{ inputs.browsers }}
          ZEUS_DEPLOY_KEEP_LOCAL: ${{ inputs.keep-local }}
          ZEUS_DEPLOY_LOCAL_PORTS: ${{ inputs.local-ports }}
          ZEUS_ACCEPTANCE_ADMIN_EMAIL: ${{ secrets.ZEUS_ACCEPTANCE_ADMIN_EMAIL }}
          ZEUS_ACCEPTANCE_ADMIN_PASSWORD: ${{ secrets.ZEUS_ACCEPTANCE_ADMIN_PASSWORD }}
        run: |
          case "$ZEUS_DEPLOY_MODE" in
            simulate) ARGS="--simulate" ;;
            local-integration) ARGS="--local-integration" ;;
            production) ARGS="" ;;
            *) echo "unknown deployment mode"; exit 2 ;;
          esac
          pnpm exec tsx scripts/release/deployment-stage2.ts $ARGS
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-deployment-stage2-evidence
          path: |
            ${{ runner.temp }}/zeus-deploy/deployment-transaction.json
            ${{ runner.temp }}/zeus-deploy/deployment-acceptance.json
            ${{ runner.temp }}/zeus-deploy/stage2-local-acceptance.json
            ${{ runner.temp }}/zeus-deploy/deployment-acceptance.repeat.json
          if-no-files-found: warn
          retention-days: 30

  local-integration:
    if: inputs.mode == 'local-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: host-deployment-stage1
          run-id: ${{ inputs.prepare-run-id }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/temp/deploy/stage1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run the successful local transaction
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/temp/deploy/stage1
          STATE_DIR: ${{ github.workspace }}/temp/deploy/stage2-state
          PROJECT: zeus-stage2-ci
          TENANT: ${{ inputs.tenant }}
          BROWSERS: ${{ inputs.browsers }}
        run: |
          CORE=$(jq -r .coreCommit "$ARTIFACT_DIR/pair.json")
          UI=$(jq -r .uiCommit "$ARTIFACT_DIR/pair.json")
          ZEUS_HOST_DEPLOY_ENABLED=true \
          ZEUS_DEPLOY_COMPOSE_FILE="$GITHUB_WORKSPACE/deploy/host-validation/compose.yml" \
          ZEUS_DEPLOY_ARTIFACT_DIR="$ARTIFACT_DIR" \
          ZEUS_DEPLOY_MANIFEST=deployment.local.json \
          ZEUS_DEPLOY_PROVENANCE=provenance.json \
          ZEUS_DEPLOY_CANDIDATE=deployment-candidate.json \
          ZEUS_DEPLOY_MANIFEST_SHA256="sha256:$(sha256sum "$ARTIFACT_DIR/deployment.local.json" | cut -d' ' -f1)" \
          ZEUS_DEPLOY_PROVENANCE_SHA256="sha256:$(sha256sum "$ARTIFACT_DIR/provenance.json" | cut -d' ' -f1)" \
          ZEUS_DEPLOY_CANDIDATE_SHA256="sha256:$(sha256sum "$ARTIFACT_DIR/deployment-candidate.json" | cut -d' ' -f1)" \
          ZEUS_DEPLOY_EXPECTED_CORE="$CORE" \
          ZEUS_DEPLOY_EXPECTED_UI="$UI" \
          ZEUS_DEPLOY_TENANT="$TENANT" \
          ZEUS_DEPLOY_STATE_DIR="$STATE_DIR" \
          ZEUS_DEPLOY_PROJECT="$PROJECT" \
          ZEUS_DEPLOY_ENVIRONMENT=local \
          ZEUS_DEPLOY_FAILURE_INJECTION=none \
          ZEUS_DEPLOY_KEEP_LOCAL=true \
          ZEUS_DEPLOY_LOCAL_PORTS=8080,8081,8082,8083 \
          ZEUS_DEPLOY_BROWSERS="$BROWSERS" \
          pnpm exec tsx scripts/release/deployment-stage2.ts --local-integration
          cp "$ARTIFACT_DIR/deployment-transaction.json" "$ARTIFACT_DIR/deployment-transaction.success.json"
          jq -e '.status == "PASS"' "$ARTIFACT_DIR/deployment-transaction.success.json"
      - name: Inject an after-acceptance failure and assert rollback
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/temp/deploy/stage1
          STATE_DIR: ${{ github.workspace }}/temp/deploy/stage2-state-drill
          PROJECT: zeus-stage2-ci
          TENANT: ${{ inputs.tenant }}
          BROWSERS: ${{ inputs.browsers }}
        run: |
          CORE=$(jq -r .coreCommit "$ARTIFACT_DIR/pair.json")
          UI=$(jq -r .uiCommit "$ARTIFACT_DIR/pair.json")
          set +e
          ZEUS_HOST_DEPLOY_ENABLED=true \
          ZEUS_DEPLOY_COMPOSE_FILE="$GITHUB_WORKSPACE/deploy/host-validation/compose.yml" \
          ZEUS_DEPLOY_ARTIFACT_DIR="$ARTIFACT_DIR" \
          ZEUS_DEPLOY_MANIFEST=deployment.local.json \
          ZEUS_DEPLOY_PROVENANCE=provenance.json \
          ZEUS_DEPLOY_CANDIDATE=deployment-candidate.json \
          ZEUS_DEPLOY_MANIFEST_SHA256="sha256:$(sha256sum "$ARTIFACT_DIR/deployment.local.json" | cut -d' ' -f1)" \
          ZEUS_DEPLOY_PROVENANCE_SHA256="sha256:$(sha256sum "$ARTIFACT_DIR/provenance.json" | cut -d' ' -f1)" \
          ZEUS_DEPLOY_CANDIDATE_SHA256="sha256:$(sha256sum "$ARTIFACT_DIR/deployment-candidate.json" | cut -d' ' -f1)" \
          ZEUS_DEPLOY_EXPECTED_CORE="$CORE" \
          ZEUS_DEPLOY_EXPECTED_UI="$UI" \
          ZEUS_DEPLOY_TENANT="$TENANT" \
          ZEUS_DEPLOY_STATE_DIR="$STATE_DIR" \
          ZEUS_DEPLOY_PROJECT="$PROJECT" \
          ZEUS_DEPLOY_ENVIRONMENT=local \
          ZEUS_DEPLOY_FAILURE_INJECTION=after-acceptance \
          ZEUS_DEPLOY_KEEP_LOCAL=false \
          ZEUS_DEPLOY_LOCAL_PORTS=8080,8081,8082,8083 \
          ZEUS_DEPLOY_BROWSERS="$BROWSERS" \
          pnpm exec tsx scripts/release/deployment-stage2.ts --local-integration
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          cp "$ARTIFACT_DIR/deployment-transaction.json" "$ARTIFACT_DIR/deployment-transaction.rollback.json"
          jq -e '.status == "ROLLED_BACK"' "$ARTIFACT_DIR/deployment-transaction.rollback.json"
          jq -e '.rollback.health == "PASS" and .rollback.buildInfoVerified == true' \
            "$ARTIFACT_DIR/deployment-transaction.rollback.json"
          jq -e '.backups.aiWorkspace.sha256 | startswith("sha256:")' \
            "$ARTIFACT_DIR/deployment-transaction.rollback.json"
          jq -e '.rollback.restoredWorkspaces | length >= 1' \
            "$ARTIFACT_DIR/deployment-transaction.rollback.json"
          for url in \
            http://127.0.0.1:8080/ \
            http://127.0.0.1:8081/sandbox.html \
            http://127.0.0.1:8082/api/health \
            http://127.0.0.1:8083/ai-host/health; do
            curl -fsS --retry 10 --retry-delay 2 "$url" >/dev/null
          done
          docker ps --format '{{.Names}} {{.Status}}'
      - name: Upload local integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-deployment-stage2-local-evidence
          path: |
            temp/deploy/stage1/deployment-transaction.success.json
            temp/deploy/stage1/deployment-transaction.rollback.json
            temp/deploy/stage1/deployment-transaction.json
            temp/deploy/stage1/stage2-local-acceptance.json
          if-no-files-found: warn
          retention-days: 30
      - name: Stop local containers
        if: always()
        run: |
          docker ps --format '{{.Names}}' | grep '^zeus-stage2-' | xargs -r docker rm -f || true
          docker network prune -f || true
