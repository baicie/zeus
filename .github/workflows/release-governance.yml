name: Release Governance

# Produces the release-environment evidence record a release is gated on.
#
# This is the only workflow that reads the `Release` environment's protection
# rules, and it is deliberately separate from CI:
#
#   - `workflow_dispatch` only, so a pull request cannot trigger it;
#   - pinned to the `Release` environment, so it inherits that environment's
#     protection (which the record then attests to — the bootstrap is that a
#     maintainer configured it, not that this workflow grants it);
#   - the token it uses is a repository secret with Administration (read), not
#     `GITHUB_TOKEN`. Ordinary CI cannot read environments at all: no workflow
#     `permissions` key grants Administration, and adding an invented key
#     invalidates the whole file.
#
# What it produces is bound to this run (id, attempt), this repository, this
# environment, this Core commit and this policy version. `release:precheck`
# checks those bindings rather than trusting a verdict, so an old run's record
# cannot be replayed against a new candidate.
on:
  workflow_dispatch:
    inputs:
      core_commit:
        description: 'Core commit the evidence is produced for (40-character SHA)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-governance
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'baicie/zeus'
    runs-on: ubuntu-latest
    environment: Release
    timeout-minutes: 10
    steps:
      - name: Require a full commit SHA
        run: |
          if ! printf '%s' "${{ inputs.core_commit }}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::core_commit must be a full 40-character SHA"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.core_commit }}
          persist-credentials: false

      - name: Verify checked out commit
        run: test "$(git rev-parse HEAD)" = "${{ inputs.core_commit }}"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The one privileged read in the repository. `ZEUS_GOVERNANCE_TOKEN` is a
      # repository secret holding a token with Administration (read); it is not
      # `GITHUB_TOKEN`, not available to PR workflows, and never echoed.
      - name: Read the Release environment and record what it found
        env:
          GH_TOKEN: ${{ secrets.ZEUS_GOVERNANCE_TOKEN }}
          ZEUS_REPOSITORY: ${{ github.repository }}
        run: >-
          pnpm exec tsx scripts/release/create-release-environment-evidence.ts
          --repository "${{ github.repository }}"
          --environment Release
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --core-commit "${{ inputs.core_commit }}"
          --out temp/release/release-environment.json

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-environment-evidence
          path: temp/release/release-environment.json
          if-no-files-found: warn
