name: Admin Image

# Builds the Zeus Admin image on every push to main that can change it, then
# rolls production onto the new digest.
#
# Three stages, each able to fail and retry on its own:
#   1. build: build linux/amd64 once, push to GHCR only, verify the tags and
#      record the digest.
#   2. mirror-tcr: copy that immutable digest to the domestic registry with
#      crane. It never rebuilds; a retry re-copies the same bytes.
#   3. deploy: pull the mirrored digest on the host by digest, verify the
#      revision label, recreate the container and check it serves.
#
# The split exists because a single `docker/build-push-action` pushing to two
# registries hung for 59 minutes after both pushes and the cache export had
# already finished (run 42964818221): the exporter waited on the second
# registry forever. Isolating the copy gives it its own timeout and stops a
# registry stall from ever recompiling the image or deploying an old one.
#
# The deploy keeps the host's `admin.env` untouched. Credentials are not in this
# repository and must not be — the first deploy writes a template the operator
# fills in, and later deploys only replace the image.
on:
  push:
    branches: [main]
    paths:
      - 'examples/admin/**'
      - 'packages/**'
      - 'crates/**'
      - 'scripts/release/build-info.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/admin-image.yml'
  pull_request:
    paths:
      - 'examples/admin/**'
      - '.github/workflows/admin-image.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Roll the production container onto the built image
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: admin-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/zeus-admin

jobs:
  build:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    # The image builds in ~1 minute warm and ~5 cold; 45 minutes leaves room
    # for a cold Rust build without letting a hang occupy an hour.
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.vars.outputs.version }}
      should_deploy: ${{ steps.vars.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve build variables
        id: vars
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          sha="${GITHUB_SHA}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          # `main` is the moving tag; the sha tag is an immutable audit point.
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${sha}" >> "$GITHUB_OUTPUT"
          fi
          echo "date_tag=$(date -u +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Deploy only from main, and only when the run was not a PR.
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.deploy }}" == "true" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the paired zeus-ui commit
        id: ui
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED: ${{ vars.ZEUS_UI_COMMIT }}
        run: |
          set -euo pipefail
          # build-info.ts rejects anything that is not a full 40-character
          # commit, so a branch name is resolved to its current SHA.
          sha="${CONFIGURED:-}"
          case "$sha" in
            *[!0-9a-f]* | '')
              sha="$(gh api "repos/${{ github.repository_owner }}/zeus-ui/commits/${sha:-main}" --jq '.sha')"
              ;;
          esac
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a 40-character zeus-ui commit (got '$sha')"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build start
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/admin/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.vars.outputs.date_tag }}
          build-args: |
            ZEUS_CORE_COMMIT=${{ github.sha }}
            ZEUS_UI_COMMIT=${{ steps.ui.outputs.sha }}
            ZEUS_VERSION=${{ steps.vars.outputs.version }}
            ZEUS_BUILD_TIME=${{ steps.vars.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=admin-image
          cache-to: type=gha,mode=max,scope=admin-image
          provenance: false

      - name: Record build duration
        if: always() && steps.build.outputs.digest != ''
        env:
          START: ${{ steps.clock.outputs.start }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - START ))
          echo "build+push(ghcr): ${elapsed}s, digest ${DIGEST}"
          {
            echo "### Build"
            echo ""
            echo "| stage | value |"
            echo "| --- | --- |"
            echo "| build + push to GHCR | ${elapsed}s |"
            echo "| digest | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the pushed tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:main"
          docker buildx imagetools inspect "${IMAGE}:sha-${{ github.sha }}"
          # Record the size: it is the number that decides whether the host can
          # pull the image at all, so it belongs in the run log.
          docker buildx imagetools inspect "${IMAGE}:main" --format '{{json .Manifest}}' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);const bytes=(m.layers||[]).reduce((a,l)=>a+l.size,0);console.log('image size:',(bytes/1024/1024).toFixed(1),'MB')})"

  mirror-tcr:
    name: Mirror to TCR
    needs: build
    # Only a real publish has something to mirror. A PR build pushes nothing.
    if: needs.build.outputs.should_deploy == 'true' && vars.TCR_IMAGE != ''
    runs-on: ubuntu-latest
    # The copy is a registry-to-registry transfer of one image. 15 minutes is
    # generous for ~300 MB and is the budget that replaces the old unbounded
    # wait.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.copy.outputs.digest }}
    env:
      # Full repository path (`host/namespace/repository`); `docker login` and
      # crane want only the host, so it is split rather than asking operators
      # to keep two variables in step.
      TCR_IMAGE: ${{ vars.TCR_IMAGE }}
    steps:
      - name: Resolve the TCR registry host
        id: tcr
        run: |
          set -euo pipefail
          host="${TCR_IMAGE%%/*}"
          if [[ ! "$host" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::TCR_IMAGE does not start with a registry host: '${TCR_IMAGE}'"
            exit 1
          fi
          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "TCR: registry ${host}, repository ${TCR_IMAGE}"

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      # The source is the immutable digest the build job produced, never the
      # moving `main` tag: a tag can be repointed by a later run, and the mirror
      # must copy exactly the bytes that were built and verified.
      - name: Copy digest to TCR
        id: copy
        env:
          SOURCE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TCR_HOST: ${{ steps.tcr.outputs.host }}
          TCR_USER: ${{ secrets.TCR_USERNAME }}
          TCR_PASS: ${{ secrets.TCR_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::the build job produced no digest to mirror"
            exit 1
          fi
          # crane reads registry credentials from the docker config. Only the
          # two registries are listed, so a copy can never be redirected
          # anywhere else.
          mkdir -p "$HOME/.docker"
          AUTH="$(printf '%s:%s' "${ACTOR}" "${GH_TOKEN}" | base64 | tr -d '\n')"
          TCR_AUTH="$(printf '%s:%s' "${TCR_USER}" "${TCR_PASS}" | base64 | tr -d '\n')"
          # 4-space indent: the heredoc body is written verbatim, and YAML only
          # strips the block's own indentation. A body indented with the script
          # would otherwise carry those spaces into JSON.
          cat > "$HOME/.docker/config.json" <<JSON
          {
              "auths": {
                  "ghcr.io": { "auth": "${AUTH}" },
                  "${TCR_HOST}": { "auth": "${TCR_AUTH}" }
              }
          }
          JSON
          rm -f "$HOME/.docker/config.json.tmp"

          start=$(date +%s)
          # Bounded retry inside a single overall deadline. The budget is
          # sized to end *before* the job timeout so the failure is an explicit
          # error with the attempt log, not a cancelled job: the first version
          # allowed 3x300s + sleeps (920s) under a 900s job limit and was
          # cancelled mid-attempt, which is exactly the silent hang this change
          # is meant to remove.
          #
          # COPY_DEADLINE=780s leaves ~2 minutes for the digest read-back and
          # the job's own teardown. A retry re-copies the same digest; it never
          # rebuilds anything.
          COPY_DEADLINE=780
          COPY_ATTEMPT_TIMEOUT=300
          COPY_MAX_ATTEMPTS=3
          output=""
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            remaining=$(( COPY_DEADLINE - ($(date +%s) - start) ))
            # Refuse to start an attempt that cannot finish inside the budget.
            # `min(${COPY_ATTEMPT_TIMEOUT}, …)` would otherwise hand `timeout`
            # a near-zero value and burn an attempt on an instant kill.
            if [[ ${attempt} -gt ${COPY_MAX_ATTEMPTS} ]]; then
              echo "::error::TCR copy gave up after ${COPY_MAX_ATTEMPTS} attempts"
              exit 1
            fi
            if [[ ${attempt} -gt 1 && ${remaining} -lt 30 ]]; then
              echo "::error::TCR copy gave up: ${attempt} attempts, deadline ${COPY_DEADLINE}s exhausted"
              exit 1
            fi
            attempt_timeout=${COPY_ATTEMPT_TIMEOUT}
            if [[ ${remaining} -lt ${attempt_timeout} ]]; then
              attempt_timeout=${remaining}
            fi
            echo "==> TCR copy attempt ${attempt} (timeout ${attempt_timeout}s, ${remaining}s of budget left)"
            # `timeout` exits 124 when it had to kill the copy. The status is
            # captured inside the branch: after `fi` it would be the `if`
            # statement's own status, not the copy's.
            status=0
            output="$(timeout "${attempt_timeout}" crane copy --platform linux/amd64 \
              "${SOURCE}@${DIGEST}" "${TCR_IMAGE}:sha-${GITHUB_SHA}")" || status=$?
            if [[ ${status} -eq 0 ]]; then
              break
            fi
            echo "::warning::TCR copy attempt ${attempt} failed (exit ${status})"
          done
          elapsed=$(( $(date +%s) - start ))

          # Read back what actually landed. A cross-registry copy is not
          # guaranteed to keep the same manifest digest, so the destination's
          # own digest is the identity to record and to deploy by. This is the
          # verification gate: the tag must resolve, and when both sides report
          # a digest they must agree.
          dest_digest="$(timeout 90 crane digest "${TCR_IMAGE}:sha-${GITHUB_SHA}" || true)"
          if [[ -z "${dest_digest}" ]]; then
            echo "::error::could not read back the mirrored digest"
            exit 1
          fi
          # `crane copy` echoes the destination digest; a mismatch means the
          # tag resolved to something else and the mirror is not trustworthy.
          copied="$(printf '%s\n' "${output}" | tail -n 1 | tr -d '[:space:]')"
          if [[ -n "${copied}" && "${copied}" != "${dest_digest}" ]]; then
            echo "::error::TCR tag resolves to ${dest_digest} but the copy reported ${copied}"
            exit 1
          fi
          echo "digest=${dest_digest}" >> "$GITHUB_OUTPUT"
          echo "tcr copy: ${elapsed}s, source ${DIGEST}, destination ${dest_digest}"
          {
            echo "### TCR mirror"
            echo ""
            echo "| stage | value |"
            echo "| --- | --- |"
            echo "| copy time | ${elapsed}s |"
            echo "| source digest | \`${DIGEST}\` |"
            echo "| destination digest | \`${dest_digest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The moving tag is updated only after the immutable digest is verified.
      # If this step fails the deployment still deploys the sha digest, so a
      # stale `main` in TCR can never roll production back.
      - name: Publish the moving tag
        env:
          TCR_HOST: ${{ steps.tcr.outputs.host }}
          TCR_USER: ${{ secrets.TCR_USERNAME }}
          TCR_PASS: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          AUTH="$(printf '%s:%s' "${TCR_USER}" "${TCR_PASS}" | base64 | tr -d '\n')"
          mkdir -p "$HOME/.docker"
          cat > "$HOME/.docker/config.json" <<JSON
          {
            "auths": {
              "${TCR_HOST}": { "auth": "${AUTH}" }
            }
          }
          JSON
          timeout 300 crane tag "${TCR_IMAGE}:sha-${GITHUB_SHA}" main
          echo "TCR main -> sha-${GITHUB_SHA}"

  deploy:
    name: Deploy
    needs: [build, mirror-tcr]
    # `always()` is here only so a *successful* build still deploys when the
    # mirror job was skipped (TCR not configured). It also drops the implicit
    # success condition on `needs`, so both are restated explicitly: a failed
    # build must never deploy, and a configured registry that failed to mirror
    # must stop the release — the host pulls from TCR, and deploying without
    # the new image would silently keep the previous build live.
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.build.outputs.should_deploy == 'true' &&
      (needs.mirror-tcr.result == 'success' || needs.mirror-tcr.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_TAG: ${{ needs.build.outputs.tag }}
      IMAGE_REF: ${{ needs.build.outputs.image }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      # When TCR is configured the host pulls from it; the GHCR digest is not
      # valid there, so the mirror job's verified digest travels instead and
      # the host pulls by digest rather than by the moving tag.
      TCR_IMAGE: ${{ vars.TCR_IMAGE }}
      TCR_DIGEST: ${{ needs.mirror-tcr.outputs.digest }}
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
      DEPLOY_HOST: ${{ vars.ZEUS_ADMIN_DEPLOY_HOST || vars.ZEUS_PLAYGROUND_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.ZEUS_ADMIN_DEPLOY_USER || vars.ZEUS_PLAYGROUND_DEPLOY_USER || 'ubuntu' }}
      DEPLOY_PORT: ${{ vars.ZEUS_ADMIN_DEPLOY_PORT || vars.ZEUS_PLAYGROUND_DEPLOY_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.ZEUS_ADMIN_DEPLOY_DIR || '/home/ubuntu/zeus-admin' }}
      CONTAINER: ${{ vars.ZEUS_ADMIN_CONTAINER || 'zeus-admin' }}
      HEALTH_URL: http://127.0.0.1:8080/api/health
      # The commit the image must carry. A tag can point at an older build after
      # an interrupted publish, so identity is read from the OCI label.
      EXPECTED_REVISION: ${{ github.sha }}
      GHCR_MIRRORS: ${{ vars.GHCR_MIRRORS || 'ghcr.nju.edu.cn' }}
      SSH_KEY: ${{ secrets.ZEUS_PLAYGROUND_DEPLOY_SSH_KEY }}
      SSH_PASSWORD: ${{ secrets.ZEUS_PLAYGROUND_DEPLOY_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Record deploy start
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check deploy credentials
        id: cred
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOST:-}" ]]; then
            echo "::error::ZEUS_ADMIN_DEPLOY_HOST (or ZEUS_PLAYGROUND_DEPLOY_HOST) is not set"
            exit 1
          fi
          if [[ -n "${SSH_KEY:-}" ]]; then
            echo "method=key" >> "$GITHUB_OUTPUT"
          elif [[ -n "${SSH_PASSWORD:-}" ]]; then
            echo "method=password" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No SSH credential available"
            exit 1
          fi

      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client sshpass

      - name: Upload deploy compose
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [[ "${{ steps.cred.outputs.method }}" == "key" ]]; then
            printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          else
            printf '%s' "${SSH_PASSWORD}" > ~/.ssh/pass
            chmod 600 ~/.ssh/pass
            SSH=(sshpass -f ~/.ssh/pass ssh)
          fi
          SSH+=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_PORT}")
          COMPOSE_B64="$(base64 < examples/admin/deploy/docker-compose.deploy.yml | tr -d '\n')"
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' -- "${DEPLOY_DIR}" "${COMPOSE_B64}" <<'REMOTE'
          set -euo pipefail
          DIR="$1"; COMPOSE="$2"
          mkdir -p "$DIR"
          printf '%s' "$COMPOSE" | base64 -d > "$DIR/docker-compose.deploy.yml"
          chmod 644 "$DIR/docker-compose.deploy.yml"
          # Credentials are the operator's and already exist on this host.
          # Requiring the file keeps a release from inventing or overwriting it:
          # rotating a password stays a deliberate act.
          if [[ ! -f "$DIR/.env" ]]; then
            echo "::error::$DIR/.env is missing. Create it before deploying."
            exit 1
          fi
          echo "credentials present: .env"
          echo "compose 已就绪: $DIR/docker-compose.deploy.yml"
          REMOTE

      - name: Rolling update container
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [[ "${{ steps.cred.outputs.method }}" == "key" ]]; then
            printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          else
            printf '%s' "${SSH_PASSWORD}" > ~/.ssh/pass
            chmod 600 ~/.ssh/pass
            SSH=(sshpass -f ~/.ssh/pass ssh)
          fi
          SSH+=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${DEPLOY_PORT}")
          # `printf %q` quotes a value so the remote shell receives it verbatim
          # — empty strings, spaces, `$`, quotes. A password must never be
          # expanded by either shell on the way through.
          q() { printf '%q' "$1"; }
          # Only the required values travel as positionals. The optional ones
          # (TCR path, credentials, expected revision) are assigned on the
          # remote command line, because `ssh host bash -s -- a "" b` drops the
          # empty argument: every later positional then shifts left, and the
          # commit hash landed where the TCR repository path belonged — docker
          # tried to log in to a registry named after a commit. Assigning them
          # here keeps each one attached to its own name, empty or not.
          REMOTE_ENV="ZEUS_TCR_IMAGE=$(q "${TCR_IMAGE}")"
          REMOTE_ENV+=" ZEUS_TCR_DIGEST=$(q "${TCR_DIGEST}")"
          REMOTE_ENV+=" ZEUS_TCR_USER=$(q "${TCR_USERNAME}")"
          REMOTE_ENV+=" ZEUS_TCR_PASS=$(q "${TCR_PASSWORD}")"
          REMOTE_ENV+=" ZEUS_EXPECTED_REVISION=$(q "${EXPECTED_REVISION}")"
          # shellcheck disable=SC2029
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${REMOTE_ENV} bash -s" -- \
            "${IMAGE_REF}" "${DEPLOY_TAG}" "${IMAGE_DIGEST}" "${CONTAINER}" \
            "${DEPLOY_DIR}" "${HEALTH_URL}" "${GHCR_MIRRORS}" <<'REMOTE'
          set -euo pipefail
          IMAGE="$1"; TAG="$2"; DIGEST="$3"; CONTAINER="$4"
          DIR="$5"; HEALTH="$6"; MIRRORS="$7"
          # Optional values arrive as environment variables so that an empty
          # one cannot shift the positionals. Default each: `set -u` would
          # abort on an unset name.
          TCR="${ZEUS_TCR_IMAGE:-}"
          TCR_DIGEST="${ZEUS_TCR_DIGEST:-}"
          TCR_USER="${ZEUS_TCR_USER:-}"
          TCR_PASS="${ZEUS_TCR_PASS:-}"
          EXPECTED_REVISION="${ZEUS_EXPECTED_REVISION:-}"
          CANONICAL="${IMAGE}:${TAG}"
          REPO_PATH="${IMAGE#ghcr.io/}"

          if docker info >/dev/null 2>&1; then
            DOCKER=(docker); echo "==> docker: direct"
          elif sudo -n true >/dev/null 2>&1; then
            DOCKER=(sudo -n docker); echo "==> docker: via sudo"
          else
            echo "::error::No docker access and no passwordless sudo on the host"
            exit 1
          fi

          if [[ "${DOCKER[0]}" == "sudo" ]]; then
            RUN=(sudo -n env "IMAGE_REPO=${IMAGE}" "IMAGE_TAG=${TAG}" "CONTAINER_NAME=${CONTAINER}" "COMPOSE_PROJECT_NAME=${CONTAINER}" "DATA_DIR=${DIR}/data" docker)
          else
            RUN=(env "IMAGE_REPO=${IMAGE}" "IMAGE_TAG=${TAG}" "CONTAINER_NAME=${CONTAINER}" "COMPOSE_PROJECT_NAME=${CONTAINER}" "DATA_DIR=${DIR}/data" docker)
          fi

          # Source order is chosen for where the transfer happens, not for
          # preference: the host reaches a domestic registry over the cloud
          # network in milliseconds, ghcr.io only across a border. A 300 MB image
          # from ghcr.io does not finish inside this session; the same image from
          # TCR does. When the mirror job ran it hands over the digest it read
          # back from TCR, and that digest — not the tag — is what gets pulled.
          candidates=()
          if [[ -n "${TCR}" ]]; then
            # TCR points at a repository, but docker authenticates a registry.
            # Logging in to the full path asks the daemon for
            # `<path>/v2/` and answers 404, so only the host is used here.
            TCR_HOST="${TCR%%/*}"
            if [[ -n "${TCR_USER}" && -n "${TCR_PASS}" ]]; then
              # A private repository needs the credential under the same docker
              # identity the pull will use.
              if [[ "${DOCKER[0]}" == "sudo" ]]; then
                printf '%s' "${TCR_PASS}" |
                  sudo -n docker login "${TCR_HOST}" -u "${TCR_USER}" --password-stdin >/dev/null
              else
                printf '%s' "${TCR_PASS}" |
                  docker login "${TCR_HOST}" -u "${TCR_USER}" --password-stdin >/dev/null
              fi
              echo "==> logged in to ${TCR_HOST}"
            fi
            if [[ -n "${TCR_DIGEST}" ]]; then
              candidates+=("${TCR}@${TCR_DIGEST}")
            fi
            candidates+=("${TCR}:${TAG}")
          fi
          if [[ -n "${MIRRORS}" ]]; then
            IFS=',' read -r -a mirror_list <<< "${MIRRORS}"
            for m in "${mirror_list[@]}"; do
              m="${m// /}"
              [[ -z "$m" ]] && continue
              [[ -n "${DIGEST}" ]] && candidates+=("${m}/${REPO_PATH}@${DIGEST}")
              candidates+=("${m}/${REPO_PATH}:${TAG}")
            done
          fi
          [[ -n "${DIGEST}" ]] && candidates+=("${IMAGE}@${DIGEST}")
          candidates+=("${CANONICAL}")

          pulled=""
          for candidate in "${candidates[@]}"; do
            echo "==> pulling ${candidate}"
            # Bound each attempt: an unbounded pull is what killed the session.
            if timeout 300 "${DOCKER[@]}" pull "${candidate}"; then
              pulled="${candidate}"; break
            fi
            echo "    (source failed or timed out, trying next)"
          done
          if [[ -z "${pulled}" ]]; then
            echo "::error::Every image source failed: ${candidates[*]}"
            exit 1
          fi
          # Retag the pulled reference to the canonical name the compose file
          # expects, so `--pull never` uses exactly what was verified.
          "${DOCKER[@]}" tag "${pulled}" "${CANONICAL}"

          # A tag is not an identity. When TCR is configured the image comes
          # from there, and a stalled publish can leave that tag pointing at the
          # previous commit — this deploy would then "succeed" while rolling
          # production back. The build stamps the commit into a label.
          if [[ -n "${EXPECTED_REVISION:-}" ]]; then
            got="$("${DOCKER[@]}" inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${CANONICAL}" 2>/dev/null || true)"
            if [[ "${got}" != "${EXPECTED_REVISION}" ]]; then
              echo "::error::${CANONICAL} is revision '${got}', expected '${EXPECTED_REVISION}'"
              exit 1
            fi
            echo "==> ${CANONICAL} @ ${got:0:8}"
          fi

          cd "$DIR"
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          "${RUN[@]}" compose -f docker-compose.deploy.yml up -d --pull never --remove-orphans --force-recreate

          # The compose file names the container, so `up` replaces it in place.
          # An older copy started with `docker run` under a different name has
          # no compose labels and would survive `--remove-orphans` while still
          # holding the same SQLite file. Retire by hazard: any other running
          # container mounting this deployment's data directory is a second
          # writer of the same database.
          data_dir="${DIR}/data"
          for other in $("${DOCKER[@]}" ps -q 2>/dev/null || true); do
            name="$("${DOCKER[@]}" inspect --format '{{.Name}}' "${other}" 2>/dev/null | sed 's#^/##')" || continue
            [[ -z "${name}" || "${name}" == "${CONTAINER}" ]] && continue
            mounts="$("${DOCKER[@]}" inspect --format '{{range .Mounts}}{{.Source}} {{end}}' "${name}" 2>/dev/null || true)"
            [[ "${mounts}" != *"${data_dir}"* ]] && continue
            echo "==> retiring ${name}: another writer of ${data_dir}"
            "${DOCKER[@]}" rm -f "${name}" >/dev/null 2>&1 || true
          done

          # Wait for the health endpoint before declaring success.
          for attempt in $(seq 1 30); do
            sleep 2
            if curl -fsS "${HEALTH}" >/dev/null 2>&1; then
              echo "==> healthy after $((attempt * 2))s"
              "${DOCKER[@]}" ps --filter "name=${CONTAINER}" --format '{{.Names}} {{.Image}} {{.Status}}'
              exit 0
            fi
          done
          echo "::error::Container did not become healthy"
          "${DOCKER[@]}" logs --tail 50 "${CONTAINER}" || true
          exit 1
          REMOTE

      # A container swap is not a deployment. The ingress decides what the
      # public actually gets, and it is operator-owned configuration that CI
      # must not rewrite. So instead of assuming, ask the public URL which
      # commit it serves and fail when it is not this one.
      - name: Verify the public site serves this commit
        if: vars.ZEUS_PUBLIC_SITE_URL != ''
        env:
          ZEUS_PUBLIC_SITE_URL: ${{ vars.ZEUS_PUBLIC_SITE_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="${ZEUS_PUBLIC_SITE_URL%/}/build-info.json"
          for _ in $(seq 1 10); do
            if body="$(curl -fsS --max-time 15 "${url}" 2>/dev/null)"; then
              served="$(printf '%s' "${body}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).coreCommit||'')}catch{}})")"
              if [[ "${served}" == "${GITHUB_SHA}" ]]; then
                echo "==> ${ZEUS_PUBLIC_SITE_URL} serves ${served}"
                exit 0
              fi
              echo "    ${url} serves '${served:-<unknown>}', waiting for ${GITHUB_SHA:0:8}"
            else
              echo "    ${url} not reachable yet"
            fi
            sleep 6
          done
          echo "::error::The public site does not serve ${GITHUB_SHA}; the ingress still points at an older build"
          exit 1

      - name: Record deploy duration
        if: always() && steps.clock.outputs.start != ''
        env:
          START: ${{ steps.clock.outputs.start }}
          DIGEST: ${{ needs.mirror-tcr.outputs.digest }}
          FROM_TCR: ${{ vars.TCR_IMAGE }}
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - START ))
          # Prefer what the host actually pulled: the mirrored digest when the
          # mirror ran, otherwise the build's own digest.
          source_sha="${DIGEST:-${GITHUB_SHA}}"
          ref="${FROM_TCR:-${IMAGE_REF}}:${DEPLOY_TAG}"
          echo "deploy: ${elapsed}s from ${ref} @ ${source_sha}"
          {
            echo "### Deploy"
            echo ""
            echo "| stage | value |"
            echo "| --- | --- |"
            echo "| deploy | ${elapsed}s |"
            echo "| image | \`${ref}\` |"
            echo "| digest | \`${source_sha}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/pass
