name: Compiler Native Matrix

# Who runs this matrix, and why each trigger exists.
#
# `pull_request` — the validation path for a change to the compiler, the Rust
# workspace or the release smoke contract. It is the *only* push-triggered
# path for feature branches: before this change `push` also listed
# `feat/**`, `fix/**` and `refactor/**`, so every commit on a branch with an
# open PR built all seven platforms twice. Runs 43216543074 (push) and
# 43216552540 (pull_request) are the same tree `179779a4`; 43216215063 and
# 43216281805 are the same tree `6d71343f`. `pull_request` fires on
# `synchronize`, so an open PR still gets exactly one matrix per commit.
#
# `push` on `main` — the post-merge validation of what landed. It used to be
# the second of two matrices built for the same commit, because
# `release-canary.yml` calls this workflow as `native-prebuild` on every main
# push. The standalone job now *skips* when that caller is going to build the
# same commit, and runs when it will not (a fork, a disabled canary, or a
# canary that failed before its prebuild). See the `build` job's `if:`.
#
# `workflow_call` — `release.yml` (tag push) and `release-canary.yml` (main
# push, and manual dispatch) use this to produce the platform artifacts they
# publish. Nothing about the call contract changed.
#
# `workflow_dispatch` — a manual full matrix on any branch, including a
# release/hotfix branch that never opens a PR.
on:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/compiler-native.yml'
      - 'crates/**'
      - 'packages/core/compiler/**'
      - 'packages/core/compiler-native/**'
      - 'packages/core/compiler-native-*/**'
      - 'scripts/bundler/build.ts'
      - 'scripts/check/check-native-packages.ts'
      - 'scripts/release/build-native-platform.ts'
      - 'scripts/release/compiler-smoke-runner.mjs'
      - 'scripts/release/smoke-compiler-install.ts'
      - 'scripts/release/sync-native-loader.ts'
      - 'scripts/release.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The duplicate this guard removes was measured, not assumed: on `main` at
  # `8f8f5256` the standalone matrix (run 43221565275, 14.7 runner minutes)
  # and `Release Canary`'s `native-prebuild` (run 43221565365, ~20 runner
  # minutes of seven-platform builds) compiled the identical tree.
  #
  # Two guards, deliberately redundant, because suppressing the build in a
  # `workflow_call` would starve the release of its artifacts:
  #
  #   1. `github.workflow` must be this workflow. When called, the `github`
  #      context belongs to the caller (`Release Canary`), so a call is never
  #      a candidate for deduplication.
  #   2. The canary run must not be this run. `github` is the caller's context
  #      inside a call, so without this the query would find the calling run
  #      itself and report "already built by canary" while running as canary.
  #
  # Every uncertain case builds: a failed query, a disabled canary, a fork. A
  # duplicate matrix costs runner minutes; a silently missing one costs a
  # release.
  dedupe-against-canary:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.workflow == 'Compiler Native Matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      canary-builds-this-commit: ${{ steps.canary.outputs.builds }}
    steps:
      - name: Will Release Canary build this commit?
        id: canary
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # `release-canary.yml` runs `native-prebuild` on every push to main,
          # unconditionally once `release-preflight` succeeds. A disabled
          # workflow returns no run, and no run means the standalone matrix
          # must build.
          # `github.sha` is the full 40-character commit; the API returns the
          # same, so this is an exact match. A prefix match would pair a
          # short SHA with whatever run happened to start with those
          # characters.
          jq_filter="[.workflow_runs[] | select(.head_sha == \"${COMMIT}\" and .id != ${RUN_ID})] | length"
          count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-canary.yml/runs?per_page=20" \
            --jq "$jq_filter" 2>/dev/null || echo "")
          if [ -z "$count" ]; then
            echo "Could not query Release Canary; building the matrix." >&2
            echo "builds=false" >> "$GITHUB_OUTPUT"
          elif [ "$count" -gt 0 ]; then
            echo "Release Canary builds ${COMMIT} in its own run; skipping the duplicate matrix."
            echo "builds=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Release Canary run for ${COMMIT}; building the matrix."
            echo "builds=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: dedupe-against-canary
    # `always()` is deliberate: a caller (`workflow_call`), a pull request and
    # a manual dispatch all reach this job without a dedupe decision, and none
    # of them may inherit a skip. Only a *successful* dedupe makes it skip.
    if: >-
      always() &&
      !(github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.workflow == 'Compiler Native Matrix' &&
        needs.dedupe-against-canary.outputs.canary-builds-this-commit == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            package: compiler-native-darwin-arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            package: compiler-native-darwin-x64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            package: compiler-native-linux-arm64-gnu
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            package: compiler-native-linux-x64-gnu
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            package: compiler-native-linux-x64-musl
            musl: true
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            package: compiler-native-win32-arm64-msvc
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            package: compiler-native-win32-x64-msvc

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.musl == true
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        if: matrix.musl == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild@0.23.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:native-packages
      - run: pnpm native:build:platform --target ${{ matrix.target }}
      - run: pnpm build compiler
      - run: pnpm check:native-binaries --package ${{ matrix.package }}
      - run: pnpm check:release-artifacts --package ${{ matrix.package }} --require-binaries

      - name: Native contract smoke test
        if: matrix.musl != true
        run: node -e "const b=require('./packages/core/${{ matrix.package }}'); const r=b.transformModule({source:'const view=<div>ok</div>',filename:'matrix.tsx',target:'dom',runtimeModule:'@zeus-js/runtime-dom',delegateEvents:true,sourceMap:true}); if(!r.code.includes('template')||r.diagnostics.length) process.exit(1)"

      - name: Public compiler tarball install smoke
        if: matrix.musl != true
        run: pnpm release:smoke:compiler --local-package ${{ matrix.package }} --expected-platform-package @zeus-js/${{ matrix.package }}

      - name: Public compiler tarball install smoke (musl)
        if: matrix.musl == true
        run: pnpm release:smoke:compiler --local-package ${{ matrix.package }} --expected-platform-package @zeus-js/${{ matrix.package }} --container-image node:24.16.0-alpine3.23@sha256:2bdb65ed1dab192432bc31c95f94155ca5ad7fc1392fb7eb7526ab682fa5bf14

      - uses: actions/upload-artifact@v4
        with:
          name: compiler-native-${{ matrix.target }}
          path: packages/core/${{ matrix.package }}
