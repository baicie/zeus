name: Devtools Release

on:
  push:
    tags:
      - 'create-zeus@*'
      - 'vite-plugin@*'
      - 'devtools-consumer@*'
      - 'compiler-wasm@*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'baicie/zeus'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node version
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # The WASM host needs a rustup target the default toolchain does not
      # carry. Without it the build below fails with `can't find crate for
      # `core`` — which reads like a broken crate graph rather than a missing
      # target. Same pin as `ci.yml`.
      - name: Install Rust 1.95 with the wasm target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build host native compiler
        run: pnpm --filter @zeus-js/compiler-native build:native

      - name: Install template smoke browsers
        if: startsWith(github.ref_name, 'create-zeus@')
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Verify published templates and browser interactions
        if: startsWith(github.ref_name, 'create-zeus@')
        run: pnpm check:create-zeus-registry --browsers chromium,firefox,webkit

      - name: Build framework and declarations
        run: pnpm build --withTypes

      # `zeus-compiler.wasm` is a cargo artifact and `.gitignore` excludes it, so
      # it does not exist after checkout. Building it here is what makes the
      # published tarball carry a compiler rather than only its loader; the
      # package's own `prepack` builds it too, and this step surfaces a toolchain
      # problem before the publish attempt instead of inside it.
      - name: Build the browser compiler
        run: pnpm --filter @zeus-js/compiler-wasm build:wasm

      - name: Build devtools
        run: pnpm --filter create-zeus --filter @zeus-js/vite-plugin --filter @zeus-js/devtools-consumer --if-present build

      - name: Verify CommonJS entries
        run: pnpm check:cjs

      - name: Verify package exports
        run: pnpm check:exports

      - name: Verify vite-plugin tarball
        run: pnpm check:vite-plugin-package

      # The tag that releases the plugin also decides which compiler it will
      # depend on. Publishing a plugin whose compiler returns no hmrPlan is the
      # 0.0.5 defect, and it cannot be found after the fact by reading versions.
      - name: Verify the compiler contract the tarball will ship with
        if: startsWith(github.ref_name, 'vite-plugin@')
        run: pnpm check:vite-plugin-contract

      - name: Publish package
        run: pnpm standalone:publish "${{ github.ref_name }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publication
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          case "$RELEASE_REF" in
            create-zeus@*) PACKAGE="create-zeus" ;;
            vite-plugin@*) PACKAGE="@zeus-js/vite-plugin" ;;
            devtools-consumer@*) PACKAGE="@zeus-js/devtools-consumer" ;;
            compiler-wasm@*) PACKAGE="@zeus-js/compiler-wasm" ;;
            *) echo "Unsupported devtools release ref: $RELEASE_REF" >&2; exit 1 ;;
          esac
          VERSION="${RELEASE_REF##*@}"
          pnpm release:verify:published --package "$PACKAGE" --version "$VERSION"

      - name: Preserve template registry report
        if: always() && startsWith(github.ref_name, 'create-zeus@')
        uses: actions/upload-artifact@v4
        with:
          name: create-zeus-registry-report
          path: temp/create-zeus-registry/report.json
          if-no-files-found: warn
