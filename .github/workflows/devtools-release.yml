name: Devtools Release

on:
  push:
    tags:
      - 'create-zeus@*'
      - 'vite-plugin@*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'baicie/zeus'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node version
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build host native compiler
        run: pnpm --filter @zeus-js/compiler-native build:native

      - name: Verify published template dependencies
        if: startsWith(github.ref_name, 'create-zeus@')
        run: pnpm check:create-zeus-registry

      - name: Build framework and declarations
        run: pnpm build --withTypes

      - name: Build devtools
        run: pnpm --filter create-zeus --filter @zeus-js/vite-plugin --if-present build

      - name: Verify CommonJS entries
        run: pnpm check:cjs

      - name: Verify package exports
        run: pnpm check:exports

      - name: Verify vite-plugin tarball
        run: pnpm check:vite-plugin-package

      - name: Publish package
        run: pnpm standalone:publish "${{ github.ref_name }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publication
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          case "$RELEASE_REF" in
            create-zeus@*) PACKAGE="create-zeus" ;;
            vite-plugin@*) PACKAGE="@zeus-js/vite-plugin" ;;
            *) echo "Unsupported devtools release ref: $RELEASE_REF" >&2; exit 1 ;;
          esac
          VERSION="${RELEASE_REF##*@}"
          pnpm release:verify:published --package "$PACKAGE" --version "$VERSION"
