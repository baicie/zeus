name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-release
  cancel-in-progress: false
  queue: max

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  native-prebuild:
    uses: ./.github/workflows/compiler-native.yml
    secrets: inherit

  release:
    if: github.repository == 'baicie/zeus'
    needs: native-prebuild
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    environment: Release
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      dist-tag: ${{ steps.release-version.outputs.dist-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify npm release authentication
        run: pnpm release:verify:npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN_BYPASS_2FA: 'true'

      - name: Download native platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: compiler-native-*
          path: temp/native-artifacts
          merge-multiple: false

      - name: Restore native platform binaries
        run: pnpm native:restore:artifacts

      - name: Install Playwright browsers for packed consumers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Extract version from tag
        id: release-version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
          else
            DIST_TAG="latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release tag source
        run: pnpm release:verify:tag-source --version "${{ steps.release-version.outputs.version }}"

      # The UI commit this release pairs with. A tag names a Core commit; the
      # UI half of the pair is a separate immutable SHA, recorded in the
      # repository so it is reviewable rather than typed at release time.
      - name: Read the paired UI commit
        id: pairing
        run: |
          FILE="release-pairing/v${{ steps.release-version.outputs.version }}.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::no pairing record at $FILE; a release needs the UI commit it was verified against"
            exit 1
          fi
          UI_COMMIT=$(node -p "require('./$FILE').uiCommit")
          UI_VERSION=$(node -p "require('./$FILE').uiVersion")
          if ! [[ "$UI_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pairing uiCommit is not a full SHA"
            exit 1
          fi
          echo "ui-commit=$UI_COMMIT" >> "$GITHUB_OUTPUT"
          echo "ui-version=$UI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout the paired UI commit
        uses: actions/checkout@v5
        with:
          repository: baicie/zeus-ui
          ref: ${{ steps.pairing.outputs.ui-commit }}
          path: temp/zeus-ui
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Core/UI exact pairing
        run: |
          test "$(git -C temp/zeus-ui rev-parse HEAD)" = "${{ steps.pairing.outputs.ui-commit }}"
          pnpm check:ui-pairing \
            --ui-root temp/zeus-ui \
            --core-version "${{ steps.release-version.outputs.version }}" \
            --ui-commit "${{ steps.pairing.outputs.ui-commit }}" \
            --ui-version "${{ steps.pairing.outputs.ui-version }}" \
            --require-commit \
            --out temp/release/ui-pairing.json

      - name: Preserve UI pairing evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-pairing
          path: temp/release/ui-pairing.json

      # Everything that can be checked without publishing, including the SBOM
      # the authorisation reads next. Order matters: `check:sbom:write` is a
      # precheck command, so authorising before this step would look for a
      # document that does not exist yet and refuse on "no SBOM was produced".
      - name: Release precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:precheck

      # The release authorisation. No approver, no run id, no allow-list: it
      # finds the CI evidence for this commit itself and refuses on any clause
      # it cannot prove. A non-zero exit here stops the workflow before any
      # publish step exists to run.
      - name: Authorise the release
        env:
          GH_TOKEN: ${{ github.token }}
          # The registry query works anonymously, but an authenticated read is
          # not rate-limited the way an anonymous one is, and a throttled
          # lookup makes the registry state "unknown" — which refuses the
          # release. Passing the token removes a network-shaped failure from
          # the path that decides whether to publish.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          pnpm exec tsx scripts/release/authorize-release.ts
          --repository "${{ github.repository }}"
          --version "${{ steps.release-version.outputs.version }}"
          --tag-ref "$GITHUB_REF"
          --workflow-sha "$GITHUB_SHA"
          --ui-commit "${{ steps.pairing.outputs.ui-commit }}"
          --ui-version "${{ steps.pairing.outputs.ui-version }}"
          --dist-tag "${{ steps.release-version.outputs.dist-tag }}"
          --require-sbom
          --bundle-report temp/release/tarballs.json
          --pairing-record "release-pairing/v${{ steps.release-version.outputs.version }}.json"
          --out temp/release/release-authorization.json

      - name: Preserve the authorisation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-authorization
          path: temp/release/release-authorization.json
          if-no-files-found: warn

      - name: Prepare Core candidate tarballs and UI overrides
        run: pnpm check:create-zeus-candidate:prepare --ui-root temp/zeus-ui

      - name: Install paired UI dependencies with Core candidates
        working-directory: temp/zeus-ui
        run: pnpm install --ignore-scripts --no-frozen-lockfile --config.confirmModulesPurge=false

      - name: Build paired UI candidate packages
        working-directory: temp/zeus-ui
        run: pnpm exec tsx scripts/commands/build.ts button

      - name: Verify create-zeus candidate templates
        run: pnpm check:create-zeus-candidate --ui-root temp/zeus-ui --candidates temp/create-zeus-candidate/candidates.json --require-pin-match

      - name: Preserve create-zeus candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-zeus-candidate-release
          path: |
            temp/create-zeus-candidate/report.json
            temp/create-zeus-candidate/candidates.json
            temp/create-zeus-candidate/prepare.json

      # Build output is produced by release:precheck step above.
      # --skipBuild is safe here as long as precheck always runs first.
      - name: Build and publish
        run: >-
          pnpm release --publishOnly "${{ steps.release-version.outputs.version }}"
          --tag "${{ steps.release-version.outputs.dist-tag }}"
          --skipBuild
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publication
        run: pnpm release:verify:published --version "${{ steps.release-version.outputs.version }}"

      - name: Verify published create-zeus scaffold
        run: pnpm check:create-zeus-packed

      - name: Verify npm dist-tags and provenance
        run: >-
          pnpm release:verify:dist-tags
          --version "${{ steps.release-version.outputs.version }}"
          --tag "${{ steps.release-version.outputs.dist-tag }}"
          --sha "$GITHUB_SHA"
          --workflow-path .github/workflows/release.yml
          --ref "$GITHUB_REF"
          --require-provenance

      # `check:latest-tags` runs in the precheck, which is *before* anything is
      # published. For a package whose RC is its first publication, `latest`
      # only starts pointing at the prerelease once this job publishes — so the
      # precheck cannot see it, and the pollution would be discovered by the
      # next release or by a user.
      #
      # This is the post-publish half. It does not block the publish (which has
      # already happened), it makes the state visible in the run that caused it,
      # with the repair command in the message.
      - name: Check npm latest after publishing
        run: pnpm check:latest-tags --version "${{ steps.release-version.outputs.version }}"

  compiler-registry-smoke:
    if: github.repository == 'baicie/zeus'
    needs: release
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.11.0']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install script dependencies
        run: pnpm install --frozen-lockfile

      - name: Install and execute published compiler
        run: pnpm release:smoke:compiler --version "${{ needs.release.outputs.version }}" --expected-platform-package @zeus-js/compiler-native-linux-x64-gnu

  github-release:
    if: github.repository == 'baicie/zeus'
    needs: [release, compiler-registry-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: Release
    steps:
      - name: Create GitHub Release
        uses: yyx990803/release-tag@8cccf7c5aa332d71d222df46677f70f77a8d2dc0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          body: |
            Please refer to [CHANGELOG.md](https://github.com/baicie/zeus/blob/main/CHANGELOG.md) for details.
