name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-release
  cancel-in-progress: false
  queue: max

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  native-prebuild:
    uses: ./.github/workflows/compiler-native.yml
    secrets: inherit

  release:
    if: github.repository == 'baicie/zeus'
    needs: native-prebuild
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    environment: Release
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      dist-tag: ${{ steps.release-version.outputs.dist-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify npm release authentication
        run: pnpm release:verify:npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN_BYPASS_2FA: 'true'

      - name: Download native platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: compiler-native-*
          path: temp/native-artifacts
          merge-multiple: false

      - name: Restore native platform binaries
        run: pnpm native:restore:artifacts

      - name: Install Playwright browsers for packed consumers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Extract version from tag
        id: release-version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
          else
            DIST_TAG="latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release tag source
        run: pnpm release:verify:tag-source --version "${{ steps.release-version.outputs.version }}"

      - name: Require approved deployment and approval evidence
        env:
          DEPLOYMENT_RUN_ID: ${{ vars.ZEUS_DEPLOYMENT_EVIDENCE_RUN_ID }}
          APPROVAL_RUN_ID: ${{ vars.ZEUS_RC_APPROVAL_RUN_ID }}
          APPROVERS: ${{ vars.ZEUS_RC_APPROVERS }}
        run: |
          test -n "$DEPLOYMENT_RUN_ID"
          test -n "$APPROVAL_RUN_ID"
          test -n "$APPROVERS"

      - name: Download attested RC approval evidence
        uses: actions/download-artifact@v4
        with:
          name: rc-approval
          run-id: ${{ vars.ZEUS_RC_APPROVAL_RUN_ID }}
          github-token: ${{ github.token }}
          path: temp/rc-approval

      # The UI commit is an immutable, approved SHA from the approval
      # document. A moving branch name is never a valid release identity.
      - name: Read the approved UI commit
        run: |
          UI_COMMIT=$(node -p "require('./temp/rc-approval/rc-approval.json').uiCommit")
          UI_VERSION=$(node -p "require('./temp/rc-approval/rc-approval.json').version")
          if ! [[ "$UI_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::approved uiCommit is not a full SHA"
            exit 1
          fi
          if [ "$UI_VERSION" != "${{ steps.release-version.outputs.version }}" ]; then
            echo "::error::approval version does not match the release tag"
            exit 1
          fi
          echo "ZEUS_UI_COMMIT=$UI_COMMIT" >> "$GITHUB_ENV"
          echo "ZEUS_UI_VERSION=$UI_VERSION" >> "$GITHUB_ENV"

      - name: Checkout the approved UI commit
        uses: actions/checkout@v5
        with:
          repository: baicie/zeus-ui
          ref: ${{ env.ZEUS_UI_COMMIT }}
          path: temp/zeus-ui
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Core/UI exact pairing
        run: |
          test "$(git -C temp/zeus-ui rev-parse HEAD)" = "$ZEUS_UI_COMMIT"
          pnpm check:ui-pairing \
            --ui-root temp/zeus-ui \
            --core-version "${{ steps.release-version.outputs.version }}" \
            --ui-commit "$ZEUS_UI_COMMIT" \
            --ui-version "$ZEUS_UI_VERSION" \
            --require-commit \
            --out temp/release/ui-pairing.json

      - name: Preserve UI pairing evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-pairing
          path: temp/release/ui-pairing.json

      - name: Download approved deployment evidence
        uses: actions/download-artifact@v4
        with:
          name: host-deployment-stage2-evidence
          run-id: ${{ vars.ZEUS_DEPLOYMENT_EVIDENCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: temp/deployment-evidence

      - name: Verify approval identity, run metadata and attestation
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVERS: ${{ vars.ZEUS_RC_APPROVERS }}
        run: >-
          pnpm exec tsx scripts/release/verify-rc-approval.ts
          --approval temp/rc-approval/rc-approval.json
          --payload temp/rc-approval/rc-approval-payload.json
          --cross-platform temp/rc-approval/cross-platform.json
          --core-commit "$GITHUB_SHA"
          --ui-commit "$ZEUS_UI_COMMIT"
          --version "${{ steps.release-version.outputs.version }}"
          --repo "${{ github.repository }}"
          --run-id "${{ vars.ZEUS_RC_APPROVAL_RUN_ID }}"
          --approvers "$APPROVERS"
          --out temp/release/approval-trust.json

      - name: Assemble deployment-bound RC evidence
        run: >-
          pnpm exec tsx scripts/release/assemble-rc-evidence.ts
          --acceptance temp/deployment-evidence/deployment-acceptance.json
          --transaction temp/deployment-evidence/deployment-transaction.json
          --provenance temp/deployment-evidence/deployment.online.provenance.json
          --pair temp/deployment-evidence/pair.json
          --approval temp/rc-approval/rc-approval.json
          --cross-platform temp/rc-approval/cross-platform.json
          --trust temp/release/approval-trust.json
          --version "${{ steps.release-version.outputs.version }}"
          --approvers "${{ vars.ZEUS_RC_APPROVERS }}"
          --source temp/deployment-evidence/evidence-source.json
          --run-id "${{ vars.ZEUS_DEPLOYMENT_EVIDENCE_RUN_ID }}"
          --out temp/release

      - name: Release precheck
        run: pnpm release:precheck

      - name: Prepare Core candidate tarballs and UI overrides
        run: pnpm check:create-zeus-candidate:prepare --ui-root temp/zeus-ui

      - name: Install paired UI dependencies with Core candidates
        working-directory: temp/zeus-ui
        run: pnpm install --ignore-scripts --no-frozen-lockfile --config.confirmModulesPurge=false

      - name: Build paired UI candidate packages
        working-directory: temp/zeus-ui
        run: pnpm exec tsx scripts/commands/build.ts button

      - name: Verify create-zeus candidate templates
        run: pnpm check:create-zeus-candidate --ui-root temp/zeus-ui --candidates temp/create-zeus-candidate/candidates.json --require-pin-match

      - name: Preserve create-zeus candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-zeus-candidate-release
          path: |
            temp/create-zeus-candidate/report.json
            temp/create-zeus-candidate/candidates.json
            temp/create-zeus-candidate/prepare.json

      # Build output is produced by release:precheck step above.
      # --skipBuild is safe here as long as precheck always runs first.
      - name: Build and publish
        run: >-
          pnpm release --publishOnly "${{ steps.release-version.outputs.version }}"
          --tag "${{ steps.release-version.outputs.dist-tag }}"
          --skipBuild
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publication
        run: pnpm release:verify:published --version "${{ steps.release-version.outputs.version }}"

      - name: Verify published create-zeus scaffold
        run: pnpm check:create-zeus-packed

      - name: Verify npm dist-tags and provenance
        run: >-
          pnpm release:verify:dist-tags
          --version "${{ steps.release-version.outputs.version }}"
          --tag "${{ steps.release-version.outputs.dist-tag }}"
          --sha "$GITHUB_SHA"
          --workflow-path .github/workflows/release.yml
          --ref "$GITHUB_REF"
          --require-provenance

  compiler-registry-smoke:
    if: github.repository == 'baicie/zeus'
    needs: release
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.11.0']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install script dependencies
        run: pnpm install --frozen-lockfile

      - name: Install and execute published compiler
        run: pnpm release:smoke:compiler --version "${{ needs.release.outputs.version }}" --expected-platform-package @zeus-js/compiler-native-linux-x64-gnu

  github-release:
    if: github.repository == 'baicie/zeus'
    needs: [release, compiler-registry-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: Release
    steps:
      - name: Create GitHub Release
        uses: yyx990803/release-tag@8cccf7c5aa332d71d222df46677f70f77a8d2dc0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          body: |
            Please refer to [CHANGELOG.md](https://github.com/baicie/zeus/blob/main/CHANGELOG.md) for details.
