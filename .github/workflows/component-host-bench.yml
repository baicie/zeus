name: Component Host Bench

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/core/**'
      - 'packages/web-c/**'
      - 'packages/headless/**'
      - 'benchmarks/component-host/**'
      - 'scripts/bench/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.node-version'
      - '.github/workflows/component-host-bench.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/core/**'
      - 'packages/web-c/**'
      - 'packages/headless/**'
      - 'benchmarks/component-host/**'
      - 'scripts/bench/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.node-version'
      - '.github/workflows/component-host-bench.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: component-host-bench-${{ github.ref }}
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  ZEUS_BENCH_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
  ZEUS_BENCH_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Puppeteer Chrome
        run: pnpm exec puppeteer browsers install chrome

      - name: Restore benchmark history
        id: previous-run
        uses: actions/github-script@v7
        with:
          script: |
            const { findBenchmarkHistory } = require('./scripts/bench/component-host-history.cjs')
            const previous = await findBenchmarkHistory({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              currentRunId: context.runId,
              log: core.info,
            })
            core.setOutput('run-id', previous?.runId ?? '')
            core.setOutput('head-sha', previous?.headSha ?? '')

      - name: Download previous main benchmark history
        if: steps.previous-run.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: component-host-benchmark
          run-id: ${{ steps.previous-run.outputs.run-id }}
          github-token: ${{ github.token }}
          path: temp/bench/component-host

      - name: Validate restored benchmark history
        if: steps.previous-run.outputs.run-id != ''
        env:
          PREVIOUS_BENCHMARK_SHA: ${{ steps.previous-run.outputs.head-sha }}
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs')
          const { assertBenchmarkHistory } = require('./scripts/bench/component-host-history.cjs')
          const history = JSON.parse(readFileSync('temp/bench/component-host/trend.json', 'utf8'))
          assertBenchmarkHistory(history, process.env.PREVIOUS_BENCHMARK_SHA)
          NODE

      - name: Build host native compiler
        run: pnpm --filter @zeus-js/compiler-native build:native

      - run: pnpm build

      - run: pnpm bench:component-host:ci

      - name: Validate benchmark runtime data
        if: always()
        env:
          PREVIOUS_BENCHMARK_SHA: ${{ steps.previous-run.outputs.head-sha }}
        run: |
          test -s temp/bench/component-host/report.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import historyChecks from './scripts/bench/component-host-history.cjs'
          const report = JSON.parse(readFileSync('temp/bench/component-host/report.json', 'utf8'))
          if (!Array.isArray(report.runtime) || report.runtime.length === 0) {
            throw new Error('runtime benchmark missing')
          }
          const history = JSON.parse(readFileSync('temp/bench/component-host/trend.json', 'utf8'))
          historyChecks.assertBenchmarkHistory(history, process.env.ZEUS_BENCH_GIT_SHA)
          if (process.env.PREVIOUS_BENCHMARK_SHA) {
            historyChecks.assertBenchmarkHistory(history, process.env.PREVIOUS_BENCHMARK_SHA)
          }
          NODE

      - name: Add benchmark report to job summary
        if: always()
        run: |
          if test -f temp/bench/component-host/report.md; then
            cat temp/bench/component-host/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Component host benchmark report unavailable.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark report and trend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-host-benchmark
          path: |
            temp/bench/component-host/report.json
            temp/bench/component-host/report.md
            temp/bench/component-host/trend.json
            temp/bench/component-host/trend.csv
          if-no-files-found: warn
          retention-days: 90
