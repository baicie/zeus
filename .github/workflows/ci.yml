name: CI

on:
  # Push builds `main`; pull requests build every branch that has one open.
  #
  # This used to also list nine branch prefixes under `push`, which made every
  # commit on a PR branch run the entire suite twice — once for the push and
  # once for the pull_request — against the identical tree. On `847b43d1` that
  # cost 43.0 runner minutes for 21.8 minutes of work: 49.4% of the spend was
  # duplicate. See docs/ci-optimization-baseline.md.
  #
  # The `pull_request` event fires on `synchronize` as well, so pushing to a
  # branch that has an open PR still triggers exactly one full run — the PR's.
  # Only a branch with no open PR stops being validated, which is deliberate:
  # push-only branches should not consume nine runners. `workflow_dispatch`
  # remains for a deliberate full run on any branch.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          # This was the only job without a pnpm cache. It looked fast because
          # the runner it landed on already had a warm store (`reused 898,
          # downloaded 0`); on a cold runner the same step downloads the
          # lockfile's dependencies. See docs/ci-optimization-baseline.md §3.
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit:prod

      - name: Secret scan
        run: pnpm check:secrets

      - name: Branch name
        run: pnpm check:branch

      - name: ESLint
        run: pnpm lint

      - name: Format check
        run: pnpm format-check

      - name: Type check
        run: pnpm check

      # Key parity, ICU syntax and placeholder sets across every
      # `locales/en.*` + `locales/zh-CN.*` pair. A missing translation, a
      # Chinese message that drops `{count}`, or an unparseable plural all
      # render as plausible text, so they need a machine check.
      - name: i18n catalogs
        run: pnpm check:i18n

      # The release contract, checked on the PR instead of after the merge.
      #
      # `@zeus-js/i18n` shipped in #234 without being registered in
      # `zeusFixedPackages` or the Changesets `fixed` group. Every PR check
      # passed; `Release Canary` failed on main afterwards. The cost of closing
      # that gap here is ~8s: this script reads package.json files and the
      # release config, and the consistency test below is already in the repo.
      - name: Release package registration
        run: pnpm check:package-versions

      - name: Release config consistency
        run: >-
          pnpm exec vitest run
          scripts/release/__tests__/release-config.spec.ts
          --reporter=dot

  rust-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2

      - run: pnpm install --frozen-lockfile

      - name: Native package metadata
        run: pnpm check:native-packages

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust lint (WASM host)
        run: cargo clippy --package zeus_compiler_wasm --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Native compiler integration
        run: pnpm test:compiler-native

      - name: WASM compiler parity with the native compiler
        run: pnpm test:compiler-wasm

      - name: Compiler optimization budget
        run: pnpm bench:compiler-optimization

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Build host native compiler
        run: pnpm --filter @zeus-js/compiler-native build:native
      - run: pnpm build
      - name: Compiler cache benchmark
        run: pnpm bench:compiler-cache
      - run: pnpm check:runtime-interop
      - run: pnpm build-dts
      - name: Packed ESLint consumer
        run: pnpm check:eslint-consumer
      - name: Docs smoke
        run: pnpm check:docs
      - name: Compiler playground snapshots
        run: pnpm playground:check
      - name: Quick Start smoke
        run: pnpm check:quick-start
      - name: Preserve first-use journey report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-use-journey
          path: temp/first-15-minutes
      - name: SSR safe import
        run: pnpm check:ssr-safe-import
      - run: pnpm check:cjs
      - run: pnpm api:check
      - run: pnpm check:exports
      - run: pnpm check:vite-plugin-package
      - run: pnpm check:repository
      - name: Verify release tarballs
        run: pnpm check:release-artifacts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Build host native compiler
        run: pnpm --filter @zeus-js/compiler-native build:native
      - run: pnpm test-unit
      - name: DevTools GC retention
        run: pnpm check:devtools-gc

  packed-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97

      - run: pnpm install --frozen-lockfile
      - name: Build packaged host compiler
        run: pnpm native:build:platform --target x86_64-unknown-linux-gnu
      - run: pnpm build
      - run: pnpm build-dts
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps --no-shell chromium firefox webkit
      - name: Native, React 18/19 and Vue 3 packed consumers
        run: pnpm check:packed-consumers
      - name: Published Golden UI consumers
        # Run after the frozen registry contract is updated to published artifacts.
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check:golden-components
      - name: RC readiness report
        if: always()
        run: pnpm check:create-zeus && pnpm check:create-zeus-packed && pnpm check:rc-readiness
        continue-on-error: true
      - name: Preserve RC readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-readiness
          path: temp/release/rc-readiness.json
      - name: Admin navigation in Chromium, Firefox and WebKit
        run: pnpm check:admin
      - name: Candidate packed HMR in Chromium, Firefox and WebKit
        run: pnpm check:hmr-packed
      - name: Explicit SSR hydration in Chromium, Firefox and WebKit
        run: pnpm check:hydration
      - name: Form-associated custom element behavior in Chromium, Firefox and WebKit
        run: pnpm check:form-associated-browser
      - name: Runtime cleanup in Chromium, Firefox and WebKit
        run: pnpm check:runtime-cleanup-browser
      - name: Accessibility tree and zoom in Chromium, Firefox and WebKit
        run: pnpm check:a11y-browser
      - name: Playground views, copying and sharing in Chromium, Firefox and WebKit
        run: pnpm playground:smoke
      - name: Next.js Server and Client boundary in Chromium, Firefox and WebKit
        run: pnpm check:next-boundary
      - name: WASM compiler Worker in Chromium, Firefox and WebKit
        run: |
          pnpm --filter @zeus-js/compiler-wasm build:wasm
          pnpm check:compiler-wasm-browser
      - name: Playground UX in Chromium, Firefox and WebKit
        run: |
          pnpm --filter @zeus-js/example-playground-editor build
          pnpm exec tsx scripts/playground/check-playground-ux.ts
      - name: Playground theme and language switching in Chromium, Firefox and WebKit
        run: pnpm check:playground-theme-i18n
      - name: DevTools click-to-binding panel in Chromium, Firefox and WebKit
        run: pnpm check:devtools-panel
      - name: Preserve consumer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-consumer-reports
          path: |
            temp/packed-consumers
            temp/golden-components
            temp/admin
            temp/hydration
            temp/form-associated-browser
            temp/runtime-cleanup-browser
            temp/a11y-browser
            temp/next-boundary
            temp/compiler-wasm
            temp/playground
            temp/playground-ux
            temp/playground-theme-i18n
            temp/devtools-panel
            temp/hmr-packed

  create-zeus-candidates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native_target: x86_64-unknown-linux-gnu
          - os: windows-latest
            native_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Checkout paired UI candidate
        uses: actions/checkout@v5
        with:
          repository: baicie/zeus-ui
          ref: ${{ vars.ZEUS_UI_REF || 'main' }}
          path: temp/zeus-ui
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            temp/zeus-ui/pnpm-lock.yaml

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97

      - run: pnpm install --frozen-lockfile

      - name: Build host native compiler
        run: pnpm native:build:platform --target ${{ matrix.native_target }}

      - run: pnpm build
      - run: pnpm build-dts

      - name: Prepare Core candidate tarballs and UI overrides
        run: pnpm check:create-zeus-candidate:prepare --ui-root temp/zeus-ui

      - name: Install UI dependencies with Core candidates
        working-directory: temp/zeus-ui
        run: pnpm install --ignore-scripts --no-frozen-lockfile --config.confirmModulesPurge=false

      - name: Build UI candidate packages
        working-directory: temp/zeus-ui
        run: pnpm exec tsx scripts/commands/build.ts button

      - name: Verify create-zeus pins
        run: pnpm check:create-zeus-versions

      - name: Install every template from candidate tarballs
        run: pnpm check:create-zeus-candidate --ui-root temp/zeus-ui --candidates temp/create-zeus-candidate/candidates.json

      - name: Preserve candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-zeus-candidate-${{ matrix.os }}
          path: |
            temp/create-zeus-candidate/report.json
            temp/create-zeus-candidate/candidates.json
            temp/create-zeus-candidate/prepare.json

  cross-platform-evidence:
    # Release evidence only ever describes a `main` commit. `release.yml` and
    # `rc-approval.yml` name the run they trust by `evidence_run_id`, and that
    # run is a main push. Collecting the same document on a pull_request run
    # produced an artifact nothing consumed — it cost an install and a 26s job
    # per PR, and a PR artifact is never the one a release points at.
    if: github.repository == 'baicie/zeus' && github.event_name != 'pull_request'
    needs: [lint-and-check, packed-consumers, create-zeus-candidates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Collect cross-platform evidence from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pnpm exec tsx scripts/release/collect-cross-platform-evidence.ts
          --repo "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --commit "$GITHUB_SHA"
          --workflow "$GITHUB_WORKFLOW"
          --workflow-path ".github/workflows/ci.yml"
          --event "$GITHUB_EVENT_NAME"

      - name: Preserve cross-platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-evidence
          path: temp/cross-platform/evidence.json

  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build

  ci-gate:
    # The one check a branch protection rule should require.
    #
    # `main` currently has no protection and no required checks, so a merge
    # depends on someone reading the list. This job gives that decision a
    # single stable name: it runs with `always()`, looks at every job it
    # depends on, and fails unless each one is either `success` or a skip it
    # was told to expect.
    #
    # The rule that matters is the default: an unrecognised result — a
    # `cancelled`, a `failure`, a `skipped` that is not in the allow list — is
    # a failure. Adding a job to this workflow without adding it to `needs`
    # does NOT silently pass; it is caught by the `expected` list below, which
    # must name every dependency.
    if: always()
    needs:
      - lint-and-check
      - rust-compiler
      - build
      - test
      - packed-consumers
      - create-zeus-candidates
      - cross-platform-evidence
      - docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      # The gate is ~40 lines of TypeScript. It runs through the repo's own
      # toolchain rather than Node's experimental type stripping, because the
      # one job whose failure blocks a merge should not depend on a flag.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify every required job
        env:
          # A JSON object of `<job name>: <result>` for everything in `needs`.
          NEEDS: ${{ toJSON(needs) }}
          # Skips this gate accepts, and why. Anything not listed here and not
          # `success` fails the gate.
          ALLOWED_SKIPS: >-
            cross-platform-evidence
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/ci/ci-gate.ts
