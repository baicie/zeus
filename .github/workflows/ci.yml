name: CI

on:
  push:
    branches:
      - main
      - codex/**
      - feat/**
      - fix/**
      - refactor/**
      - chore/**
      - docs/**
      - test/**
      - release/**
      - hotfix/**
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'

      - run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit:prod

      - name: Branch name
        run: pnpm check:branch

      - name: ESLint
        run: pnpm lint

      - name: Format check
        run: pnpm format-check

      - name: Type check
        run: pnpm check

  rust-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2

      - run: pnpm install --frozen-lockfile

      - name: Native package metadata
        run: pnpm check:native-packages

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Native compiler integration
        run: pnpm test:compiler-native

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Build host native compiler
        run: pnpm --filter @zeus-js/compiler-native build:native
      - run: pnpm build
      - run: pnpm check:runtime-interop
      - run: pnpm build-dts
      - name: SSR safe import
        run: pnpm check:ssr-safe-import
      - run: pnpm check:cjs
      - run: pnpm api:check
      - run: pnpm check:exports
      - run: pnpm check:vite-plugin-package
      - run: pnpm check:repository
      - name: Verify release tarballs
        run: pnpm check:release-artifacts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Build host native compiler
        run: pnpm --filter @zeus-js/compiler-native build:native
      - run: pnpm test-unit

  packed-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97

      - run: pnpm install --frozen-lockfile
      - name: Build packaged host compiler
        run: pnpm native:build:platform --target x86_64-unknown-linux-gnu
      - run: pnpm build
      - run: pnpm build-dts
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps --no-shell chromium firefox webkit
      - name: Native, React 18/19 and Vue 3 packed consumers
        run: pnpm check:packed-consumers
      - name: Preserve consumer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-consumer-reports
          path: temp/packed-consumers

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
