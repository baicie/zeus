name: CI

on:
  # Push builds `main`; pull requests build every branch that has one open.
  #
  # This used to also list nine branch prefixes under `push`, which made every
  # commit on a PR branch run the entire suite twice — once for the push and
  # once for the pull_request — against the identical tree. On `847b43d1` that
  # cost 43.0 runner minutes for 21.8 minutes of work: 49.4% of the spend was
  # duplicate. See docs/ci/optimization-baseline.md.
  #
  # The `pull_request` event fires on `synchronize` as well, so pushing to a
  # branch that has an open PR still triggers exactly one full run — the PR's.
  # Only a branch with no open PR stops being validated, which is deliberate:
  # push-only branches should not consume nine runners. `workflow_dispatch`
  # remains for a deliberate full run on any branch.
  push:
    branches:
      - main
  # Any base, not just `main`.
  #
  # Limiting this to `main` meant a stacked pull request — one whose base is
  # another feature branch — ran no CI at all. R6-C is exactly that shape: it
  # targets R6-A's branch, and its `packed-consumers` gate (which is where
  # `check:admin` lives) therefore never executed on a pull request. The gap
  # was invisible because `workflow_dispatch` does run on any branch: a
  # deliberate run passed, and nothing said the ordinary path was skipping it.
  #
  # Cost is bounded by the impact classifier, which already decides job by job
  # whether a change can matter. A stacked PR that touches one package runs
  # what that package needs, not the suite.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  # Runs first and always. Everything else keys off its output.
  #
  # A failure here is not "skip everything" — it is a hard stop. An impact
  # analysis that cannot answer must not be interpreted as "nothing to check".
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lint-and-check: ${{ steps.plan.outputs.lint-and-check }}
      rust-compiler: ${{ steps.plan.outputs.rust-compiler }}
      build: ${{ steps.plan.outputs.build }}
      test: ${{ steps.plan.outputs.test }}
      packed-consumers: ${{ steps.plan.outputs.packed-consumers }}
      browser-web-components: ${{ steps.plan.outputs.browser-web-components }}
      browser-playground: ${{ steps.plan.outputs.browser-playground }}
      create-zeus-candidates: ${{ steps.plan.outputs.create-zeus-candidates }}
      docs-build: ${{ steps.plan.outputs.docs-build }}
      full-run: ${{ steps.plan.outputs.full-run }}
      planned-skips: ${{ steps.plan.outputs.planned-skips }}
    steps:
      - uses: actions/checkout@v5
        with:
          # `git diff base...head` needs both endpoints. A shallow clone of
          # depth 1 has neither history nor the merge base.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Classify the change
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # `temp/` does not exist in a fresh checkout, and a shell redirect
          # cannot create it — the redirect is opened before the command runs.
          mkdir -p temp/ci
          pnpm exec tsx scripts/ci/impact-analysis.ts \
            --base "${BASE_SHA:-}" \
            --head HEAD \
            --event "$EVENT" \
            --json temp/ci/impact.json > temp/ci/impact.stdout.json
          node --input-type=module -e "
            import { readFileSync, appendFileSync } from 'node:fs'
            const plan = JSON.parse(readFileSync('temp/ci/impact.json', 'utf8'))
            const skips = []
            for (const job of plan.jobs) {
              appendFileSync(process.env.GITHUB_OUTPUT, job.name + '=' + job.run + '\n')
              if (!job.run) skips.push(job.name)
            }
            appendFileSync(process.env.GITHUB_OUTPUT, 'full-run=' + plan.fullRun + '\n')
            appendFileSync(process.env.GITHUB_OUTPUT, 'planned-skips=' + skips.join(' ') + '\n')
          "

      - name: Summarize the decision
        if: always()
        run: |
          set -euo pipefail
          if [ -f temp/ci/impact.json ]; then
            node --input-type=module -e "
              import { readFileSync } from 'node:fs'
              const plan = JSON.parse(readFileSync('temp/ci/impact.json', 'utf8'))
              const lines = [
                '### Change impact',
                '',
                'Event: \`' + plan.event + '\` — full run: \`' + plan.fullRun + '\`',
                'Areas: ' + (plan.areas.length ? plan.areas.map(a => '\`' + a + '\`').join(', ') : '_none_'),
                '',
                '| Job | Runs | Why |',
                '| --- | --- | --- |',
                ...plan.jobs.map(j => '| ' + j.name + ' | ' + (j.run ? 'yes' : 'no') + ' | ' + j.reason + ' |'),
              ]
              if (plan.escalated.length) {
                lines.push('', '**Escalated:**', ...plan.escalated.map(e => '- ' + e))
              }
              console.log(lines.join('\n'))
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Impact analysis produced no plan." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The plan as a file, not just a rendered summary.
      #
      # A job summary is not readable through the API, so until now the only
      # way to check what impact analysis actually decided was to read the
      # step log of a passing `impact` job — and a summary that has scrolled
      # away is not evidence. This artifact is the record: for every job, the
      # reason it ran or skipped, and what escalated the analysis.
      #
      # Uploaded with `if: always()` because the interesting case is exactly
      # the one where the classification is surprising.
      - name: Preserve the impact plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-plan
          path: temp/ci/impact.json
          if-no-files-found: warn
          retention-days: 14

  lint-and-check:
    needs: impact
    if: needs.impact.outputs.lint-and-check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          # This was the only job without a pnpm cache. It looked fast because
          # the runner it landed on already had a warm store (`reused 898,
          # downloaded 0`); on a cold runner the same step downloads the
          # lockfile's dependencies. See docs/ci/optimization-baseline.md §3.
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit:prod

      - name: Secret scan
        run: pnpm check:secrets

      - name: Branch name
        run: pnpm check:branch

      # Generate the SBOM so a broken generator or an unparseable lockfile fails
      # here rather than during a release.
      #
      # Deliberately *not* followed by `check:sbom`. That compares against the
      # document on disk, and `temp/` is gitignored — a fresh checkout has no
      # document, so `--check` would compare the write against itself and pass
      # unconditionally. A gate that cannot fail is worse than no gate.
      #
      # What this step does verify: the generator runs, every published
      # package's importer resolves, and the lockfile yields a runtime
      # dependency set. The staleness check belongs to the release precheck,
      # where the document is written and compared within one run.
      - name: Generate SBOM
        run: pnpm check:sbom:write

      # Structure of every workflow file, as GitHub's own schema sees it.
      #
      # #292 added `administration: read` to a `permissions` block. The YAML
      # parsed, so nothing here caught it; GitHub rejected both files before
      # creating a job, the runs failed in 0s with zero jobs, and `gh pr checks`
      # reported no failure at all. `actionlint` is the only check that sees
      # this class, and it runs before the expensive jobs rather than after.
      - name: Install actionlint
        run: |
          # Pinned: a new actionlint release can add rules, and an unrelated
          # rule appearing should be a deliberate upgrade, not a surprise red.
          #
          # Downloaded directly with a checksum rather than through rhysd's
          # install script, whose argument handling printed usage and exited
          # instead of installing. The checksums file ships with the release, so
          # a tampered archive fails here rather than running.
          VERSION=1.7.12
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSL "${BASE}/${ARCHIVE}" -o "$RUNNER_TEMP/${ARCHIVE}"
          curl -fsSL "${BASE}/actionlint_${VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          ( cd "$RUNNER_TEMP" && grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c - )
          tar -xzf "$RUNNER_TEMP/${ARCHIVE}" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/actionlint/actionlint" --version

      - name: Workflow structure
        run: pnpm check:workflows

      - name: ESLint
        run: pnpm lint

      - name: Format check
        run: pnpm format-check

      - name: Type check
        run: pnpm check

      # The six-domain package layout. A package's directory states its role:
      # `packages/core` is the runtime and nothing else, and a router, compiler
      # adapter or test helper placed there is what let the layout drift before.
      # The gate also holds the 38-package / 32-release / 8-native contract, so
      # a package cannot be added or moved without a deliberate edit here.
      - name: Package structure
        run: pnpm check:structure

      # The root directory: which directories may exist, which are pinned
      # because a release or deployment reads them by path, whether the vendor
      # ignore exception is still ordered after the rule it excepts, and
      # whether the document called "current pipeline" still describes the
      # current pipeline. `check-structure` governs `packages/`; nothing
      # governed the root until this.
      - name: Root structure
        run: pnpm check:root

      # Key parity, ICU syntax and placeholder sets across every
      # `locales/en.*` + `locales/zh-CN.*` pair. A missing translation, a
      # Chinese message that drops `{count}`, or an unparseable plural all
      # render as plausible text, so they need a machine check.
      - name: i18n catalogs
        run: pnpm check:i18n

      # The release contract, checked on the PR instead of after the merge.
      #
      # `@zeus-js/i18n` shipped in #234 without being registered in
      # `zeusFixedPackages`, so a new workspace package that nobody registered
      # is caught here rather than by `Release Canary` after the merge.
      - name: Release package registration
        run: pnpm check:package-versions

      # The Changesets `fixed` list duplicates `zeusFixedPackages`, and the two
      # are compared by `scripts/release/__tests__/release-config.spec.ts`.
      # That test runs under the shared vitest config, whose top-level import
      # of `compile-test-views.ts` loads the native compiler — a build product
      # this job deliberately does not produce. Rather than pull a Rust build
      # into a lint job, the same invariants are checked here without vitest:
      #   - every fixed package exists and is public
      #   - both lists agree, in order
      # If the comparison ever moves into its own script, delete this step.
      - name: Release config consistency
        run: pnpm exec tsx scripts/ci/check-release-config.ts

  rust-compiler:
    needs: impact
    if: needs.impact.outputs.rust-compiler == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2

      - run: pnpm install --frozen-lockfile

      - name: Native package metadata
        run: pnpm check:native-packages

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust lint (WASM host)
        run: cargo clippy --package zeus_compiler_wasm --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Native compiler integration
        run: pnpm test:compiler-native

      - name: WASM compiler parity with the native compiler
        run: pnpm test:compiler-wasm

      - name: Compiler optimization budget
        run: pnpm bench:compiler-optimization

  build:
    needs: impact
    if: needs.impact.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Build host native compiler
        run: pnpm --filter @zeus-js/compiler-native build:native
      - run: pnpm build
      # The structured size report: every published artifact with raw, gzip and
      # Brotli bytes, compared against the committed baseline with the reviewed
      # per-package budget in `scripts/size/size-budget.json`. It runs here
      # because this is the one job that builds every package without also
      # rebuilding them for a consumer test.
      #
      # A regression fails the build. An artifact with no matching budget is
      # reported NO_BUDGET rather than passing, and a published package that
      # produced no artifact is UNMEASURED — never zero, which is how the old
      # image-size gate failed open.
      #
      # The napi `.node` binaries are governed by an absolute ceiling rather
      # than by the baseline: their filenames and bytes are platform-specific,
      # and this runner builds a linux-x64-gnu binary where the baseline was
      # recorded on darwin-arm64. The other seven platform packages are absent
      # by design (optionalDependencies), which the report marks as expected.
      - name: Build size report
        run: pnpm size:report:ci
      - name: Preserve the size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-size-report
          path: temp/size
          retention-days: 30
      - name: Publish the size report to the job summary
        if: always()
        run: |
          if [ -f temp/size/size-report.md ]; then
            cat temp/size/size-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compiler cache benchmark
        run: pnpm bench:compiler-cache
      - run: pnpm check:runtime-interop
      - run: pnpm build-dts
      - name: Packed ESLint consumer
        run: pnpm check:eslint-consumer
      - name: Docs smoke
        run: pnpm check:docs
      - name: Compiler playground snapshots
        run: pnpm playground:check
      - name: Quick Start smoke
        run: pnpm check:quick-start
      - name: Preserve first-use journey report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-use-journey
          path: temp/first-15-minutes
      - name: SSR safe import
        run: pnpm check:ssr-safe-import
      - run: pnpm check:cjs
      - run: pnpm api:check
      - run: pnpm check:exports
      - run: pnpm check:vite-plugin-package
      - run: pnpm check:repository
      - name: Verify release tarballs
        run: pnpm check:release-artifacts
      # A workflow must run in the environment its trigger can reach. A job
      # bound to a tag-only environment but dispatched from `main` is
      # undeployable, and the usual fix is to widen the environment rather than
      # move the job — which is the bypass the rule exists to prevent.
      - name: Check the workflow → environment topology
        run: pnpm check:environment-topology
      # A UI consumer must not install the compiler. This packs the wrappers
      # and asserts the build toolchain stays out of a runtime-only tree; the
      # cost was invisible to per-package size gates because every package was
      # individually fine.
      - name: Check the runtime dependency boundary
        run: pnpm check:runtime-boundary
      # A release reads its pairing record by version at tag time. Validating
      # them here means a malformed record fails in the PR that adds it rather
      # than in the release that needed it.
      - name: Check the release pairing records
        run: pnpm check:release-pairing

  test:
    needs: impact
    if: needs.impact.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Build host native compiler
        run: pnpm --filter @zeus-js/compiler-native build:native
      - run: pnpm test-unit
      - name: DevTools GC retention
        run: pnpm check:devtools-gc

  # Release evidence: this job's name is pinned by
  # `collect-cross-platform-evidence.ts` (`PLATFORM_JOBS.linux`), and
  # `cross-platform-evidence` requires it to have run and passed. It keeps the
  # packed-consumer contract, the RC readiness report and the Admin gate; the
  # browser gates that do not produce release evidence moved out.
  #
  # Why the split, and why only this far (measured on run 43246592042):
  #
  #   job wall clock                        403s
  #   setup + install + native + build     ~105s   (playwright install 50s)
  #   packed consumers + RC readiness       ~85s
  #   remaining 12 browser gates           ~186s
  #
  # `pnpm exec playwright install --with-deps` is 41s of apt dependencies and
  # 9s of browser downloads, and `native:build:platform` is a Rust build that
  # every gate needs through `@zeus-js/compiler-native`. A job per gate would
  # pay ~105s of setup each time and multiply runner minutes; two groups keep
  # the per-job setup amortised over several gates.
  packed-consumers:
    needs: impact
    permissions:
      contents: read
    if: needs.impact.outputs.packed-consumers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97

      - run: pnpm install --frozen-lockfile
      - name: Build packaged host compiler
        run: pnpm native:build:platform --target x86_64-unknown-linux-gnu
      - run: pnpm build
      - run: pnpm build-dts
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps --no-shell chromium firefox webkit
      - name: Native, React 18/19 and Vue 3 packed consumers
        run: pnpm check:packed-consumers
      - name: Published Golden UI consumers
        # Run after the frozen registry contract is updated to published artifacts.
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check:golden-components
      # Jobs run on separate runners and do not share `temp/`. The SBOM is
      # written in `lint-and-check`, whose filesystem this job never sees, so
      # `check:rc-readiness` reported `sbom: not_run` on every run — the check
      # was present but starved of its input.
      - name: Generate SBOM for the readiness report
        if: always()
        run: pnpm check:sbom:write

      - name: RC readiness report
        if: always()
        env:
          # `GET /repos/{owner}/{repo}/environments` needs Administration
          # permission, and `GITHUB_TOKEN` has no scope that grants it — there
          # is no `administration` key in a workflow's `permissions` block, and
          # adding one makes the whole workflow file invalid (measured: the run
          # fails in 0s with no jobs).
          #
          # So this job cannot read the protection rules with its own token.
          # The probe reports `unauthorized` and the check stays `not_run`,
          # which is the honest answer: the claim of protection was not
          # confirmed. Reading it in CI would require a PAT with
          # `administration: read`, and putting a PAT in ordinary CI is exactly
          # what this task forbids.
          #
          # The token is still passed so a caller that *does* have a capable
          # token (a local run, or a dedicated release-check job) works without
          # a code change. It is never a PAT here, and `gh` takes it from the
          # environment — the probe logs state names only.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:create-zeus && pnpm check:create-zeus-packed && pnpm check:rc-readiness
        continue-on-error: true
      - name: Preserve RC readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-readiness
          path: temp/release/rc-readiness.json
      # Strict UI provenance over a real build-info.
      #
      # `verifyUiSources` had no caller outside its tests, so the strict checks
      # were never run against an artifact. This builds the Admin example's
      # build-info and verifies it at `release-strict`: the lockfile must be the
      # one in this checkout, every registry package must resolve to bytes, and
      # the document's declared pairing must match its own `uiCommit`.
      #
      # A tampered integrity, a document verified against a different lockfile,
      # or a stale build-info all fail here rather than at release time.
      - name: Verify UI provenance against the lockfile
        run: |
          pnpm --filter @zeus-js/example-admin build
          node --import tsx scripts/release/build-info.ts \
            --product admin \
            --dist examples/admin/dist \
            --core-commit "$GITHUB_SHA" \
            --ui-commit "${ZEUS_UI_COMMIT:-$(git rev-parse HEAD)}" \
            --ui-manifest examples/admin/package.json \
            --version "$(node -p "require('./package.json').version")" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The manifest pins every @zeus-web package to one exact version, and
          # the attestation's source ref is that version's tag in zeus-ui.
          # Passing it pins the *release* the bytes came from, not just the
          # repository — a package republished from a branch would fail here.
          UI_VERSION="$(node -p "Object.entries(require('./examples/admin/package.json').dependencies).find(([n]) => n === '@zeus-web/button')[1]")"
          pnpm check:ui-provenance \
            --build-info examples/admin/dist/build-info.json \
            --manifest examples/admin/package.json \
            --read-attestations \
            --expected-ref "refs/tags/v$UI_VERSION"

      - name: Admin navigation in Chromium, Firefox and WebKit
        run: pnpm check:admin
      - name: Candidate packed HMR in Chromium, Firefox and WebKit
        run: pnpm check:hmr-packed
      - name: Explicit SSR hydration in Chromium, Firefox and WebKit
        run: pnpm check:hydration
      - name: Preserve consumer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-consumer-reports
          path: |
            temp/packed-consumers
            temp/golden-components
            temp/admin
            temp/hydration
            temp/hmr-packed

  # The Web Components and browser-behaviour gates, split from
  # `packed-consumers` to shorten the critical path. Each still runs every
  # engine — Chromium, Firefox and WebKit — because the point of the split is
  # wall clock, not coverage.
  #
  # `continue-on-error` is deliberately absent: a failure here fails
  # `ci-gate` exactly like a failure in `packed-consumers`.
  browser-web-components:
    needs: impact
    if: needs.impact.outputs.browser-web-components == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97

      - run: pnpm install --frozen-lockfile
      - name: Build packaged host compiler
        run: pnpm native:build:platform --target x86_64-unknown-linux-gnu
      - run: pnpm build
      - run: pnpm build-dts
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps --no-shell chromium firefox webkit
      - name: Form-associated custom element behavior in Chromium, Firefox and WebKit
        run: pnpm check:form-associated-browser
      - name: Runtime cleanup in Chromium, Firefox and WebKit
        run: pnpm check:runtime-cleanup-browser
      - name: Accessibility tree and zoom in Chromium, Firefox and WebKit
        run: pnpm check:a11y-browser
      - name: Next.js Server and Client boundary in Chromium, Firefox and WebKit
        run: pnpm check:next-boundary
      - name: DevTools click-to-binding panel in Chromium, Firefox and WebKit
        run: pnpm check:devtools-panel
      # Attribute/property reflection, Shadow and Light DOM, named and default
      # slots, and connect/disconnect cycles with cleanup counts. The existing
      # checks in this job cover form participation and cleanup separately;
      # none covers the slot and projection surface.
      - name: Custom element lifecycle and slots in Chromium, Firefox and WebKit
        run: pnpm check:web-components-browser
      - name: Preserve Web Components browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-web-components-reports
          path: |
            temp/form-associated-browser
            temp/runtime-cleanup-browser
            temp/a11y-browser
            temp/next-boundary
            temp/devtools-panel
            temp/web-components-browser

  # Playground, WASM Worker and i18n gates. Same shape as the job above, and
  # for the same reason: the Playground editor build is a Vite bundle that the
  # UX, theme/i18n and WASM Worker gates all read.
  # The runtime correctness browser checks: DOM identity, hydration (adoption,
  # reactivity, marker boundaries) and HMR lifecycle.
  #
  # A job of its own for the timeout, not the setup. `browser-playground` runs
  # five Playground gates and was already close to its 25-minute budget; adding
  # six three-engine checks to it pushed the job past the limit, and a job that
  # is killed by its timeout reports nothing about the checks that had not run
  # yet. This job starts at `pnpm build` with a budget of its own, so a slow
  # Playground gate can no longer decide whether runtime correctness is measured.
  #
  # The trigger is `BROWSER_GATE_AREAS`, the same constant the other two browser
  # jobs use: these checks read the compiler, the runtime and the signal engine,
  # and a change to any of them has to run all of them.
  browser-runtime:
    needs: impact
    if: needs.impact.outputs.browser-web-components == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97

      - run: pnpm install --frozen-lockfile
      - name: Build packaged host compiler
        run: pnpm native:build:platform --target x86_64-unknown-linux-gnu
      - run: pnpm build
      - run: pnpm build-dts
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps --no-shell chromium firefox webkit

      # Precise DOM updates: a signal write leaves every untouched node the same
      # object, and a keyed list reuses, evicts and converges as it should.
      - name: DOM precise updates in Chromium, Firefox and WebKit
        run: pnpm check:dom-update-browser

      # Hydration adoption across the server/client boundary, which no HTML
      # comparison can make.
      - name: SSR hydration in Chromium, Firefox and WebKit
        run: pnpm check:ssr-hydration-browser

      # The adopted tree must still be reactive: a signal write reaches the
      # node, and disposal stops it.
      - name: Hydration reactive bindings in Chromium, Firefox and WebKit
        run: pnpm check:hydration-reactivity-browser

      # Marker bookkeeping that produces HTML which looks right and a tree the
      # client cannot walk.
      - name: Hydration marker boundaries in Chromium, Firefox and WebKit
        run: pnpm check:hydration-boundaries-browser

      # A DOM update must do only the work it has to, not merely keep node
      # identity.
      - name: DOM minimal work in Chromium, Firefox and WebKit
        run: pnpm check:dom-minimal-work-browser

      # Repeated hot updates and unmount, where effect leaks show up.
      - name: HMR lifecycle in Chromium
        run: pnpm check:hmr-lifecycle-browser

      - name: Preserve runtime browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-reports
          path: |
            temp/dom-update-browser
            temp/ssr-hydration-browser
            temp/hydration-reactivity-browser
            temp/hydration-boundaries-browser
            temp/dom-minimal-work-browser
            temp/hmr-lifecycle-browser

  browser-playground:
    needs: impact
    if: needs.impact.outputs.browser-playground == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97

      - run: pnpm install --frozen-lockfile
      - name: Build packaged host compiler
        run: pnpm native:build:platform --target x86_64-unknown-linux-gnu
      - run: pnpm build
      - run: pnpm build-dts
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps --no-shell chromium firefox webkit
      - name: Playground views, copying and sharing in Chromium, Firefox and WebKit
        run: pnpm playground:smoke
      - name: WASM compiler Worker in Chromium, Firefox and WebKit
        run: |
          pnpm --filter @zeus-js/compiler-wasm build:wasm
          pnpm check:compiler-wasm-browser
      # `check:playground-ux` already builds the editor. The previous step
      # list ran `pnpm --filter @zeus-js/example-playground-editor build`
      # immediately before it, which built the same bundle twice (36s).
      - name: Playground UX in Chromium, Firefox and WebKit
        run: pnpm check:playground-ux
      # The loop budget, on every pull request.
      #
      # `check:playground-editor` covers the same ground but runs only from
      # `product-acceptance.yml` on a release branch or a manual dispatch, so a
      # regression in the budget could ship and only be noticed at release time.
      #
      # The gate itself cannot hang: each phase races a 90 s deadline, the
      # browser is closed in a `finally`, and this job declares
      # `timeout-minutes`. A deadline hit fails the step rather than passing it.
      # It reads `examples/playground-editor/dist`, which `check:playground-ux`
      # above has just built.
      - name: Playground loop budget in Chromium, Firefox and WebKit
        run: pnpm check:playground-loop-budget
      - name: Playground theme and language switching in Chromium, Firefox and WebKit
        run: pnpm check:playground-theme-i18n
      - name: Preserve Playground browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-playground-reports
          path: |
            temp/playground
            temp/playground-ux
            temp/playground-theme-i18n
            temp/compiler-wasm

  create-zeus-candidates:
    needs: impact
    if: needs.impact.outputs.create-zeus-candidates == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native_target: x86_64-unknown-linux-gnu
          - os: windows-latest
            native_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Checkout paired UI candidate
        uses: actions/checkout@v5
        with:
          repository: baicie/zeus-ui
          ref: ${{ vars.ZEUS_UI_REF || 'main' }}
          path: temp/zeus-ui
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            temp/zeus-ui/pnpm-lock.yaml

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97

      - run: pnpm install --frozen-lockfile

      - name: Build host native compiler
        run: pnpm native:build:platform --target ${{ matrix.native_target }}

      - run: pnpm build
      - run: pnpm build-dts

      - name: Prepare Core candidate tarballs and UI overrides
        run: pnpm check:create-zeus-candidate:prepare --ui-root temp/zeus-ui

      - name: Install UI dependencies with Core candidates
        working-directory: temp/zeus-ui
        run: pnpm install --ignore-scripts --no-frozen-lockfile --config.confirmModulesPurge=false

      - name: Build UI candidate packages
        working-directory: temp/zeus-ui
        run: pnpm exec tsx scripts/commands/build.ts button

      - name: Verify create-zeus pins
        run: pnpm check:create-zeus-versions

      - name: Install every template from candidate tarballs
        run: pnpm check:create-zeus-candidate --ui-root temp/zeus-ui --candidates temp/create-zeus-candidate/candidates.json

      - name: Preserve candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-zeus-candidate-${{ matrix.os }}
          path: |
            temp/create-zeus-candidate/report.json
            temp/create-zeus-candidate/candidates.json
            temp/create-zeus-candidate/prepare.json

  cross-platform-evidence:
    # Release evidence only ever describes a `main` commit. `release.yml` and
    # `rc-approval.yml` name the run they trust by `evidence_run_id`, and that
    # run is a main push. Collecting the same document on a pull_request run
    # produced an artifact nothing consumed — it cost an install and a 26s job
    # per PR, and a PR artifact is never the one a release points at.
    #
    # `needs.impact.outputs.full-run == 'true'` is redundant given the event
    # filter — push and workflow_dispatch both force a full run — and that is
    # exactly why it is written down. The collector requires three specific
    # jobs to have run and passed (`PLATFORM_JOBS` in
    # collect-cross-platform-evidence.ts); if a future change ever lets impact
    # analysis skip one of them on a main push, this job must not silently
    # collect a document describing checks that never happened.
    if: >-
      github.repository == 'baicie/zeus' &&
      github.event_name != 'pull_request' &&
      needs.impact.outputs.full-run == 'true'
    needs: [impact, lint-and-check, packed-consumers, create-zeus-candidates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Collect cross-platform evidence from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pnpm exec tsx scripts/release/collect-cross-platform-evidence.ts
          --repo "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --commit "$GITHUB_SHA"
          --workflow "$GITHUB_WORKFLOW"
          --workflow-path ".github/workflows/ci.yml"
          --event "$GITHUB_EVENT_NAME"

      - name: Preserve cross-platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-evidence
          path: temp/cross-platform/evidence.json

  docs-build:
    needs: impact
    if: needs.impact.outputs.docs-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build

  ci-gate:
    # The one check a branch protection rule should require.
    #
    # `main` currently has no protection and no required checks, so a merge
    # depends on someone reading the list. This job gives that decision a
    # single stable name: it runs with `always()`, looks at every job it
    # depends on, and fails unless each one is either `success` or a skip it
    # was told to expect.
    #
    # The rule that matters is the default: an unrecognised result — a
    # `cancelled`, a `failure`, a `skipped` that is not in the allow list — is
    # a failure. Adding a job to this workflow without adding it to `needs`
    # does NOT silently pass; it is caught by the `expected` list below, which
    # must name every dependency.
    #
    # The skip allow list is computed, not fixed: it is exactly the set of jobs
    # impact analysis decided not to run, plus `cross-platform-evidence` on a
    # pull request. A skipped job that is not in that set still fails, so a job
    # which stops itself for any other reason cannot hide behind this gate.
    #
    # `browser-web-components` and `browser-playground` are here because the
    # gates they carry used to be steps inside `packed-consumers`. A split
    # that left them out of the gate would turn every browser check into a
    # non-blocking one while still reporting green.
    if: always()
    needs:
      - impact
      - lint-and-check
      - rust-compiler
      - build
      - test
      - packed-consumers
      - browser-web-components
      - browser-playground
      - create-zeus-candidates
      - cross-platform-evidence
      - docs-build
      - browser-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      # The gate is ~40 lines of TypeScript. It runs through the repo's own
      # toolchain rather than Node's experimental type stripping, because the
      # one job whose failure blocks a merge should not depend on a flag.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify every required job
        env:
          # A JSON object of `<job name>: <result>` for everything in `needs`.
          NEEDS: ${{ toJSON(needs) }}
          # The jobs impact analysis decided to skip, space separated. A skip
          # outside this set is a failure even if it is skipped, so a job
          # cannot quietly opt out for its own reasons.
          PLANNED_SKIPS: ${{ needs.impact.outputs.planned-skips }}
          IMPACT_RESULT: ${{ needs.impact.result }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/ci/ci-gate.ts
