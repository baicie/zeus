[workspace]
members = [
  "crates/zeus_compiler",
  "packages/compiler/compiler-native",
  "packages/compiler/compiler-wasm",
]
resolver = "3"

[workspace.package]
version = "0.2.0-rc.9"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/baicie/zeus"

[workspace.dependencies]
oxc_allocator = "=0.146.0"
oxc_ast = "=0.146.0"
oxc_ast_visit = "=0.146.0"
oxc_diagnostics = "=0.146.0"
oxc_parser = "=0.146.0"
oxc_semantic = "=0.146.0"
oxc_sourcemap = "=8.1.2"
oxc_span = "=0.146.0"
oxc_syntax = "=0.146.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syn = { version = "2.0.119", features = ["full", "visit"] }
napi = { version = "=3.16.2", default-features = false, features = ["napi8"] }
napi-derive = "=3.7.1"
napi-build = "=2.6.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

# 第三方依赖不带调试信息以减小 target 体积（自家 crate 保留调试信息）
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
